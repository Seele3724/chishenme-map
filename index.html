<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>上海美食地图</title>
<meta name="description" content="按菜系、人均、评分筛上海餐厅，地图上一眼看清。可以自己上传餐厅、补充评价。">
<meta name="theme-color" content="#c8452a">
<meta property="og:type" content="website">
<meta property="og:title" content="上海美食地图">
<meta property="og:description" content="按菜系、人均、评分筛上海餐厅，地图上一眼看清。">
<meta property="og:locale" content="zh_CN">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c8452a'/%3E%3Cpath d='M32 14c-7.7 0-14 6.1-14 13.7 0 10.3 14 22.3 14 22.3s14-12 14-22.3C46 20.1 39.7 14 32 14z' fill='%23fff'/%3E%3Ccircle cx='32' cy='27.5' r='5' fill='%23c8452a'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#1d1c1a; --ink2:#5b5750; --ink3:#938d82;
  --paper:#fffdf9; --line:#e9e2d5; --accent:#c8452a; --green:#1f4f45;
  --bg:#f2ece1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);background:var(--bg);overflow:hidden;
  -webkit-font-smoothing:antialiased;font-size:14px;
}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#d8d0c1;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

#app{display:flex;height:100vh;height:100dvh}

/* ---------------- 左栏 ---------------- */
#panel{
  width:392px;flex:none;display:flex;flex-direction:column;
  background:var(--paper);border-right:1px solid var(--line);z-index:30;
}
.phead{padding:16px 18px 0;flex:none}
.brand{display:flex;align-items:center;gap:10px}
.seal{
  width:34px;height:34px;flex:none;border-radius:9px;background:var(--accent);
  color:#fff;display:grid;place-items:center;font-size:17px;font-weight:700;
  letter-spacing:0;box-shadow:0 3px 10px rgba(200,69,42,.28);
}
.brand h1{margin:0;font-size:19px;letter-spacing:.5px;font-weight:700}
.brand .sub{font-size:11px;color:var(--ink3);margin-top:2px;letter-spacing:.3px}
.mpill{display:none}
.demo-note{
  margin:12px 0 0;padding:7px 10px;border-radius:8px;background:#fdf3ea;
  border:1px solid #f3ddc8;color:#9a5a2c;font-size:11.5px;line-height:1.5;
}

.search{
  margin-top:14px;position:relative;
}
.search input{
  width:100%;height:38px;border:1px solid var(--line);border-radius:10px;
  padding:0 12px 0 34px;background:#fff;outline:none;
}
.search input:focus{border-color:#cbbfa8;box-shadow:0 0 0 3px rgba(200,69,42,.07)}
.search svg{position:absolute;left:11px;top:11px;opacity:.4}

.filters{padding:12px 18px 0;flex:none}
.frow{display:flex;gap:8px;margin-bottom:9px;align-items:center}
.frow>label{font-size:11.5px;color:var(--ink3);width:38px;flex:none;letter-spacing:.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--line);background:#fff;border-radius:99px;
  padding:4.5px 11px;font-size:12px;color:var(--ink2);transition:.15s;
  display:inline-flex;align-items:center;gap:5px;
}
.chip:hover{border-color:#cfc4ae}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:none}
select.mini{
  height:31px;border:1px solid var(--line);border-radius:8px;background:#fff;
  padding:0 8px;font-size:12.5px;color:var(--ink2);outline:none;flex:1;min-width:0;
}

.listbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 18px 8px;border-bottom:1px solid var(--line);flex:none;margin-top:4px;
}
.listbar b{color:var(--accent);font-size:15px}
.listbar span{font-size:12px;color:var(--ink3)}

.fmore{display:none}

#list{flex:1;overflow-y:auto;padding:10px 14px 18px;overscroll-behavior:contain}
.card{
  background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;margin-bottom:9px;cursor:pointer;transition:.16s;
  position:relative;overflow:hidden;
}
.card:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(60,45,20,.08);border-color:#ded4c2}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.card.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.card-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card-top h3{margin:0;font-size:14.5px;font-weight:600;line-height:1.3}
.rate{
  font-size:15px;font-weight:700;color:var(--accent);flex:none;
  font-variant-numeric:tabular-nums;letter-spacing:-.3px;
}
.rate small{font-size:9px;font-weight:500;color:var(--ink3);margin-left:2px}
.card-meta{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:11.5px;color:var(--ink2);flex-wrap:wrap}
.tag{
  background:color-mix(in srgb, var(--c) 12%, #fff);
  color:var(--c);border:1px solid color-mix(in srgb, var(--c) 28%, #fff);
  border-radius:5px;padding:1px 6px;font-size:11px;font-weight:600;
}
.sep{color:#d5cdc0}
.card-addr{margin-top:5px;font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--ink3);font-size:13px;padding:42px 20px;line-height:1.7}

.pfoot{
  flex:none;padding:9px 18px;border-top:1px solid var(--line);
  display:flex;gap:14px;align-items:center;background:#faf6ee;font-size:11.5px;
}
.pfoot a{color:var(--ink3);text-decoration:none;border-bottom:1px dotted #c9c0af;padding-bottom:1px}
.pfoot a:hover{color:var(--accent);border-color:var(--accent)}
.pfoot .sp{flex:1}

/* ---------------- 地图 ---------------- */
#mapwrap{flex:1;position:relative;background:#e7e2d6}
#map{position:absolute;inset:0;z-index:1}
.legend{
  position:absolute;left:14px;bottom:22px;z-index:400;background:rgba(255,253,249,.94);
  border:1px solid var(--line);border-radius:10px;padding:9px 11px;
  display:flex;flex-wrap:wrap;gap:4px 10px;max-width:330px;
  font-size:11px;color:var(--ink2);backdrop-filter:blur(6px);
  box-shadow:0 4px 14px rgba(60,45,20,.09);
}
.legend i{display:inline-flex;align-items:center;gap:4px;font-style:normal}
.legend .dot{width:8px;height:8px;border-radius:50%}
.mapbtn{
  position:absolute;right:14px;top:14px;z-index:400;display:flex;gap:6px;
}
.mapbtn button{
  background:rgba(255,253,249,.95);border:1px solid var(--line);border-radius:9px;
  height:32px;padding:0 11px;font-size:12px;color:var(--ink2);
  box-shadow:0 4px 12px rgba(60,45,20,.1);
}
.mapbtn button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#pickbar{
  position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:800;
  background:var(--ink);color:#fff;border-radius:99px;padding:9px 18px;
  font-size:13px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.28);white-space:nowrap;
}
#pickbar.on{display:block}
#pickbar b{color:#ffd28a}

/* ---------------- 详情 ---------------- */
#detail{
  position:absolute;top:0;right:0;height:100%;width:452px;max-width:100%;
  background:var(--paper);z-index:600;border-left:1px solid var(--line);
  display:flex;flex-direction:column;transform:translateX(101%);
  transition:transform .3s cubic-bezier(.32,.72,.28,1);
  box-shadow:-16px 0 40px rgba(60,45,20,.13);
}
#detail.open{transform:none}
.dhead{flex:none;padding:16px 18px 14px;border-bottom:1px solid var(--line);position:relative}
.close{
  position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;
  border:none;background:#f1ebe0;color:var(--ink2);font-size:16px;line-height:1;
}
.close:hover{background:#e6dece}
.dhead h2{margin:0 40px 8px 0;font-size:20px;letter-spacing:.3px}
.dstats{display:flex;gap:16px;align-items:flex-end;margin-top:4px}
.big{font-size:30px;font-weight:700;color:var(--accent);line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.big.none{font-size:20px;color:var(--ink3);letter-spacing:0}
.dstats .lbl{font-size:11px;color:var(--ink3);margin-bottom:3px}
.dstats .cell{display:flex;flex-direction:column;gap:3px}
.dstats .val{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.daddr{margin-top:12px;font-size:12.5px;color:var(--ink2);display:flex;gap:6px;align-items:flex-start;line-height:1.5}
.daddr svg{flex:none;margin-top:2px;opacity:.5}
.dtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dtags span{background:#f4efe4;border-radius:6px;padding:3px 8px;font-size:11.5px;color:var(--ink2)}

#dbody{flex:1;overflow-y:auto;padding:16px 18px 28px;overscroll-behavior:contain}
.sect{margin-bottom:22px}
.sect h4{
  margin:0 0 11px;font-size:12px;color:var(--ink3);font-weight:600;
  letter-spacing:1.4px;text-transform:uppercase;
}
.sect h4 em{font-style:normal;color:var(--accent);margin-left:4px;letter-spacing:0}

.rev{border-bottom:1px dashed #ece5d8;padding:11px 0 12px;position:relative}
.rev:last-child{border-bottom:none}
.rev-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.avatar{
  width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;
  display:grid;place-items:center;font-size:11px;font-weight:600;flex:none;
}
.rev-top b{font-size:12.5px;font-weight:600}
.rev-top time{font-size:11px;color:var(--ink3);margin-left:auto}
.stars{color:#e2a33c;font-size:12px;letter-spacing:1px}
.rev p{margin:0;font-size:13px;line-height:1.65;color:var(--ink2);white-space:pre-wrap;word-break:break-word}
.delrev{
  position:absolute;right:0;bottom:9px;border:none;background:none;color:#c3b9a8;
  font-size:11px;padding:2px 4px;
}
.delrev:hover{color:var(--accent)}

.form{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.form .field{margin-bottom:11px}
.form .field:last-of-type{margin-bottom:0}
.form label{display:block;font-size:11.5px;color:var(--ink3);margin-bottom:5px}
.form input[type=text],.form textarea{
  width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;
  background:#fefcf8;outline:none;transition:.15s;
}
.form input[type=text]:focus,.form textarea:focus{border-color:#cbbfa8;background:#fff}
.form textarea{resize:vertical;min-height:70px;line-height:1.6}
.starpick{display:flex;gap:3px;font-size:26px;line-height:1;user-select:none}
.starpick span{color:#e4dccd;cursor:pointer;transition:.12s}
.starpick span.on{color:#e2a33c}
.starpick span:hover{transform:scale(1.12)}
.btn{
  border:none;border-radius:9px;height:38px;padding:0 18px;font-size:13.5px;
  font-weight:600;background:var(--ink);color:#fff;transition:.15s;width:100%;
}
.btn:hover{background:#000}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink2);border:1px solid var(--line)}
.btn.ghost:hover{background:#f8f3e9;color:var(--ink)}
.btn.sm{height:33px;font-size:12.5px;padding:0 14px;width:auto}

/* ---------------- 弹窗 ---------------- */
.modal{
  position:fixed;inset:0;background:rgba(28,22,14,.5);z-index:900;
  display:none;align-items:center;justify-content:center;padding:18px;
  backdrop-filter:blur(2px);
}
.modal.open{display:flex}
.modal.hiding{display:none}
.mcard{
  background:var(--paper);border-radius:16px;width:100%;max-width:470px;
  max-height:88vh;overflow-y:auto;padding:20px 20px 18px;
  box-shadow:0 24px 60px rgba(0,0,0,.3);
}
.mcard h3{margin:0 0 4px;font-size:17px}
.mcard .hint{font-size:11.5px;color:var(--ink3);margin:0 0 16px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mrow{margin-bottom:11px}
.mrow label{display:block;font-size:11.5px;color:var(--ink3);margin-bottom:5px}
.mrow label i{color:var(--accent);font-style:normal}
.mrow input,.mrow select{
  width:100%;height:37px;border:1px solid var(--line);border-radius:8px;
  padding:0 10px;background:#fff;outline:none;
}
.mrow input:focus,.mrow select:focus{border-color:#cbbfa8;box-shadow:0 0 0 3px rgba(200,69,42,.07)}
.coordbox{
  display:flex;gap:8px;align-items:center;background:#f7f2e7;border:1px dashed #ddd2bd;
  border-radius:9px;padding:9px 11px;font-size:12px;color:var(--ink2);
}
.coordbox b{font-variant-numeric:tabular-nums;color:var(--ink)}
.mactions{display:flex;gap:9px;margin-top:18px}
.mactions .btn{flex:1}

/* ---------------- 聚簇 ---------------- */
.clwrap{background:none;border:none}
.cl{
  display:grid;place-items:center;border-radius:50%;
  background:#fff;color:#1d1c1a;font-weight:700;letter-spacing:-.5px;
  border:3px solid var(--c);box-shadow:0 3px 12px rgba(40,30,10,.22);
  transition:transform .15s;font-variant-numeric:tabular-nums;
}
.cl:hover{transform:scale(1.09)}

/* ---------------- 移动端 ---------------- */
.grab{display:none}
@media (max-width: 900px){
  #app{flex-direction:column}
  #mapwrap{position:absolute;inset:0}
  #panel{
    position:absolute;left:0;right:0;bottom:0;width:auto;height:62vh;
    border-right:none;border-top:1px solid var(--line);
    border-radius:18px 18px 0 0;
    box-shadow:0 -10px 34px rgba(60,45,20,.18);
    transition:height .28s cubic-bezier(.32,.72,.28,1);
    padding-bottom:env(safe-area-inset-bottom);
  }
  #panel.collapsed{height:86px}
  #panel.collapsed .search{display:none}
  #panel.collapsed .phead{padding-bottom:7px}
  #moreFilters{display:none}
  #moreFilters.open{display:block}
  #expHint{display:none}
  .fmore{
    display:inline-flex;align-items:center;gap:3px;
    border:1px solid var(--line);background:#fff;border-radius:99px;
    padding:4px 10px;font-size:11.5px;color:var(--ink2);
  }
  .fmore.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .mpill{
    display:inline-flex;align-items:center;gap:4px;margin-left:auto;
    background:#f4eee2;border-radius:99px;padding:4px 10px;
    font-size:11.5px;color:var(--ink2);font-weight:600;
  }
  .grab{
    display:block;height:22px;flex:none;cursor:pointer;position:relative;
  }
  .grab::after{
    content:"";position:absolute;left:50%;top:8px;transform:translateX(-50%);
    width:38px;height:4px;border-radius:4px;background:#d9d0bf;
  }
  .phead{padding-top:4px}
  .brand h1{font-size:17px}
  .demo-note{display:none}
  .seal{width:30px;height:30px;font-size:15px}
  .legend{display:none}
  .mapbtn{top:auto;bottom:calc(62vh + 12px);right:12px;flex-direction:column}
  .mapbtn button{height:30px;padding:0 10px;font-size:11.5px}
  #panel.collapsed ~ #mapwrap .mapbtn{bottom:calc(86px + 12px)}
  #detail{width:100%;border-left:none}
  .filters{padding-top:9px}
  #list{padding:8px 12px 14px}
  .card{padding:10px 12px}
}

@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<div id="app">
  <!-- 左栏 -->
  <aside id="panel">
    <div class="grab" id="grab"></div>
    <div class="phead">
      <div class="brand">
        <div class="seal" id="brandSeal">沪</div>
        <div>
          <h1 id="brandTitle">上海美食地图</h1>
          <div class="sub">按菜系 · 人均 · 评分找店</div>
        </div>
        <span class="mpill" id="mpill">38 家</span>
      </div>
      <p class="demo-note">演示数据：评分与人均为模拟值，非真实点评。你添加的餐厅和评价只保存在本机浏览器里。</p>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1d1c1a" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="搜餐厅名、菜系、地址…" autocomplete="off">
      </div>
    </div>

    <div class="filters">
      <div class="frow" style="align-items:flex-start">
        <label style="padding-top:5px">城市</label>
        <div class="chips" id="cityChips"></div>
      </div>
      <div class="frow" style="align-items:flex-start">
        <label style="padding-top:5px">菜系</label>
        <div class="chips" id="cuisineChips"></div>
      </div>
      <div id="moreFilters">
        <div class="frow">
          <label>人均</label>
          <select class="mini" id="priceSel">
            <option value="all">不限</option>
            <option value="0-50">¥50 以下</option>
            <option value="50-100">¥50–100</option>
            <option value="100-200">¥100–200</option>
            <option value="200-9999">¥200 以上</option>
          </select>
        </div>
        <div class="frow">
          <label>评分</label>
          <select class="mini" id="rateSel">
            <option value="0">不限</option>
            <option value="4">4.0 分以上</option>
            <option value="4.5">4.5 分以上</option>
          </select>
        </div>
        <div class="frow">
          <label>排序</label>
          <select class="mini" id="sortSel">
            <option value="rating">评分从高到低</option>
            <option value="count">点评数从多到少</option>
            <option value="priceAsc">人均从低到高</option>
            <option value="priceDesc">人均从高到低</option>
          </select>
        </div>
      </div>
    </div>

    <div class="listbar">
      <span>共 <b id="count">0</b> 家餐厅</span>
      <button class="fmore" id="fmore">更多筛选 ▾</button>
      <span id="expHint">点地图上的点看详情</span>
    </div>

    <div id="list"></div>

    <div class="pfoot">
      <a href="#" id="btnAdd">＋ 添加餐厅</a>
      <a href="#" id="btnExport">导出数据</a>
      <span class="sp"></span>
      <a href="#" id="btnReset" style="color:#bfb3a0">清空本机数据</a>
    </div>
  </aside>

  <!-- 地图 -->
  <div id="mapwrap">
    <div id="map"></div>
    <div class="mapbtn">
      <button id="bmAmap" class="on">高德底图</button>
      <button id="bmOsm">OSM</button>
    </div>
    <div class="legend" id="legend"></div>
    <div id="pickbar">点击地图选择位置 · 按 <b>Esc</b> 取消</div>
  </div>

  <!-- 详情 -->
  <section id="detail">
    <div class="dhead">
      <button class="close" id="btnClose" title="关闭">✕</button>
      <div id="dheadInner"></div>
    </div>
    <div id="dbody"></div>
  </section>
</div>

<!-- 添加餐厅 -->
<div class="modal" id="modal">
  <div class="mcard">
    <h3>添加一家餐厅</h3>
    <p class="hint">原型阶段先填基本信息。上线时这里可以改成先搜高德 POI 自动带出地址和坐标。</p>
    <div class="mrow">
      <label>餐厅名称 <i>*</i></label>
      <input id="fName" type="text" placeholder="例如：阿娘面">
    </div>
    <div class="grid2">
      <div class="mrow">
        <label>城市 <i>*</i></label>
        <select id="fCity"></select>
      </div>
      <div class="mrow">
        <label>菜系 <i>*</i></label>
        <select id="fCuisine"></select>
      </div>
    </div>
    <div class="mrow">
      <label>人均（元） <i>*</i></label>
      <input id="fPrice" type="number" min="0" step="1" placeholder="80">
    </div>
    <div class="mrow">
      <label>地址</label>
      <input id="fAddr" type="text" placeholder="黄浦区思南路36号">
    </div>
    <div class="mrow">
      <label>你的评分（可选，0–5）</label>

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function allRest(){ return DEMO.concat(customRest); }
function findRest(id){ return allRest().find(r => r.id === id); }

function reviewsFor(id){
  const base = (findRest(id) || {}).reviews || [];
  return base.concat(userRevs[id] || []);
}
function statsFor(r){
  const mine = userRevs[r.id] || [];
  const n = (r.count || 0) + mine.length;
  if(!n) return { rating: 0, count: 0 };
  const sum = (r.count || 0) * (r.rating || 0) + mine.reduce((a, x) => a + x.stars, 0);
  return { rating: sum / n, count: n };
}
function cuColor(c){ return CU_COLOR[c] || "#7f8c8d"; }

const FMT = new Intl.DateTimeFormat("zh-CN", { year: "numeric", month: "2-digit", day: "2-digit" });
function fmt(ts){
  if(typeof ts === "number") return FMT.format(new Date(ts)).replace(/\//g, "-");
  return ts;
}
function stars(n){ return "★".repeat(Math.round(n)) + "☆".repeat(Math.max(0, 5 - Math.round(n))); }

/* WGS84 -> GCJ02（高德底图需要，否则点位会偏几百米） */
function wgs2gcj(lng, lat){
  const PI = Math.PI, a = 6378245.0, ee = 0.00669342162296594323;
  function tLat(x, y){
    let r = -100 + 2*x + 3*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
    r += (20*Math.sin(6*x*PI) + 20*Math.sin(2*x*PI)) * 2/3;
    r += (20*Math.sin(y*PI) + 40*Math.sin(y/3*PI)) * 2/3;
    r += (160*Math.sin(y/12*PI) + 320*Math.sin(y*PI/30)) * 2/3;
    return r;
  }
  function tLng(x, y){
    let r = 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
    r += (20*Math.sin(6*x*PI) + 20*Math.sin(2*x*PI)) * 2/3;
    r += (20*Math.sin(x*PI) + 40*Math.sin(x/3*PI)) * 2/3;
    r += (150*Math.sin(x/12*PI) + 300*Math.sin(x/30*PI)) * 2/3;
    return r;
  }
  let dLat = tLat(lng - 105, lat - 35), dLng = tLng(lng - 105, lat - 35);
  const radLat = lat / 180 * PI;
  let magic = Math.sin(radLat); magic = 1 - ee * magic * magic;
  const sq = Math.sqrt(magic);
  dLat = (dLat * 180) / ((a * (1 - ee)) / (magic * sq) * PI);
  dLng = (dLng * 180) / (a / sq * Math.cos(radLat) * PI);
  return [lng + dLng, lat + dLat];
}
function toMap(lat, lng){
  if(state.basemap === "amap"){
    const g = wgs2gcj(lng, lat);
    return [g[1], g[0]];
  }
  return [lat, lng];
}

/* =========================================================
   3. 筛选
   ========================================================= */
function visible(){
  const q = state.q.trim().toLowerCase();
  let arr = allRest().filter(r => {
    if(r.city !== state.city) return false;
    if(state.cuisines.size && !state.cuisines.has(r.cuisine)) return false;

    if(state.price !== "all"){
      const [lo, hi] = state.price.split("-").map(Number);
      if(!(r.price >= lo && r.price < hi)) return false;
    }
    const s = statsFor(r);
    if(state.minRate > 0 && s.rating < state.minRate) return false;

    if(q){
      const hay = (r.name + " " + r.cuisine + " " + (r.addr || "") + " " + (r.tags || []).join(" ")).toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  });

  const S = {
    rating: (a, b) => statsFor(b).rating - statsFor(a).rating || statsFor(b).count - statsFor(a).count,
    count: (a, b) => statsFor(b).count - statsFor(a).count,
    priceAsc: (a, b) => a.price - b.price,
    priceDesc: (a, b) => b.price - a.price
  };
  return arr.sort(S[state.sort] || S.rating);
}

/* =========================================================
   4. 地图
   ========================================================= */
let map = null, markers = null, tileLayer = null, pickMarker = null;

function tileURL(){
  return state.basemap === "amap"
    ? "https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}"
    : "https://tile.openstreetmap.org/{z}/{x}/{y}.png";
}

function initMap(){
  const v = CITY_VIEW[state.city] || CITY_VIEW["上海"];
  map = L.map("map", { zoomControl: true, attributionControl: true })
        .setView(toMap(v.center[0], v.center[1]), v.zoom);

  tileLayer = L.tileLayer(tileURL(), {
    subdomains: state.basemap === "amap" ? "1234" : "abc",
    maxZoom: 19,
    attribution: state.basemap === "amap"
      ? '&copy; 高德地图'
      : '&copy; OpenStreetMap contributors'
  }).addTo(map);

  tileLayer.on("tileerror", function(){
    if(!window.__tileWarned){
      window.__tileWarned = true;
      console.warn("底图瓦片加载失败，可切换到 OSM 看看");
    }
  });

  markers = L.layerGroup().addTo(map);
  map.on("zoomend", drawMarkers);

  map.on("click", function(e){
    if(!state.pickMode) return;
    const ll = e.latlng;
    let lat = ll.lat, lng = ll.lng;
    if(state.basemap === "amap"){
      const g = gcj2wgs(lng, lat);
      lng = g[0]; lat = g[1];
    }
    state.newLat = lat; state.newLng = lng;
    if(pickMarker) map.removeLayer(pickMarker);
    pickMarker = L.circleMarker(ll, { radius: 9, color: "#c8452a", weight: 3, fillColor: "#c8452a", fillOpacity: .5 }).addTo(map);
    $("#fCoord").textContent = lat.toFixed(5) + ", " + lng.toFixed(5);
    endPick();
    $("#modal").classList.add("open");
  });

  drawMarkers();
  setTimeout(() => map.invalidateSize(), 60);
}

/* GCJ02 -> WGS84（反解，一次迭代够用） */
function gcj2wgs(lng, lat){
  const g = wgs2gcj(lng, lat);
  return [lng * 2 - g[0], lat * 2 - g[1]];
}

function drawMarkers(){
  if(!markers || !map) return;
  markers.clearLayers();

  const list = visible().filter(r => r.lat != null && r.lng != null);
  const z = map.getZoom();

  // 放大到足够级别就直接铺点，否则按屏幕网格聚簇
  if(z >= 15){
    list.forEach(r => markers.addLayer(singleMarker(r)));
    return;
  }

  const GRID = 62;
  const groups = new Map();
  list.forEach(r => {
    const p = map.project(toMap(r.lat, r.lng), z);
    const k = Math.floor(p.x / GRID) + ":" + Math.floor(p.y / GRID);
    if(!groups.has(k)) groups.set(k, []);
    groups.get(k).push(r);
  });

  groups.forEach(g => {
    if(g.length === 1){ markers.addLayer(singleMarker(g[0])); return; }

    let sx = 0, sy = 0;
    g.forEach(r => { const p = map.project(toMap(r.lat, r.lng), z); sx += p.x; sy += p.y; });
    const center = map.unproject(L.point(sx / g.length, sy / g.length), z);

    // 这一片里占比最多的菜系，用来给圆环上色
    const tally = {};
    g.forEach(r => { tally[r.cuisine] = (tally[r.cuisine] || 0) + 1; });
    const topCu = Object.keys(tally).sort((a, b) => tally[b] - tally[a])[0];

    const size = Math.round(34 + Math.min(26, Math.sqrt(g.length) * 5.5));
    const icon = L.divIcon({
      html: '<div class="cl" style="--c:' + cuColor(topCu) + ';width:' + size + 'px;height:' + size +
            'px;font-size:' + (g.length > 9 ? 13 : 14.5) + 'px">' + g.length + "</div>",
      className: "clwrap",
      iconSize: [size, size],
      iconAnchor: [size / 2, size / 2]
    });

    const m = L.marker(center, { icon: icon, keyboard: false, riseOnHover: true });
    m.bindTooltip("这一片有 <b>" + g.length + "</b> 家 · 点一下放大",
      { direction: "top", offset: [0, -size / 2], className: "mtip" });
    m.on("click", function(ev){
      L.DomEvent.stopPropagation(ev);
      map.setView(center, Math.min(z + 2, 17));
    });
    markers.addLayer(m);
  });
}

function singleMarker(r){
  const s = statsFor(r);
  const base = 6 + Math.min(7, Math.sqrt(s.count || 0) / 5);

  const m = L.circleMarker(toMap(r.lat, r.lng), {
    radius: base,
    fillColor: cuColor(r.cuisine),
    color: "#fff",
    weight: 2,
    opacity: 1,
    fillOpacity: .92
  });

  m.bindTooltip(
    "<b>" + esc(r.name) + "</b><br><span style=\"opacity:.65\">" + esc(r.cuisine) +
    " · ¥" + r.price + "/人 · " + (s.rating ? s.rating.toFixed(1) + "分" : "暂无评分") + "</span>",
    { direction: "top", offset: [0, -4], className: "mtip" }
  );

  m.on("click", function(ev){ L.DomEvent.stopPropagation(ev); openDetail(r.id); });
  m.on("mouseover", function(){ m.setStyle({ weight: 3, radius: base + 2 }); });
  m.on("mouseout", function(){
    if(state.selectedId !== r.id) m.setStyle({ weight: 2, radius: base });
  });

  if(state.selectedId === r.id){
    m.setStyle({ weight: 4, color: "#1d1c1a", radius: base + 2 });
    m.bringToFront();
  }
  return m;
}

function setBasemap(bm){
  if(state.basemap === bm) return;
  state.basemap = bm;
  $("#bmAmap").classList.toggle("on", bm === "amap");
  $("#bmOsm").classList.toggle("on", bm === "osm");
  if(map){
    map.removeLayer(tileLayer);
    tileLayer = L.tileLayer(tileURL(), {
      subdomains: bm === "amap" ? "1234" : "abc",
      maxZoom: 19,
      attribution: bm === "amap" ? '&copy; 高德地图' : '&copy; OpenStreetMap contributors'
    }).addTo(map);
    tileLayer.bringToBack();
    drawMarkers();
    if(state.selectedId){
      const r = findRest(state.selectedId);
      if(r) map.setView(toMap(r.lat, r.lng), map.getZoom());
    }
  }
}

   5. 列表

function renderList(){
  const list = visible();
  $("#count").textContent = list.length;
  const pill = $("#mpill");
  if(pill) pill.textContent = list.length + " 家";

  if(!list.length){
    $("#list").innerHTML = '<div class="empty">没有符合条件的餐厅<br>试着放宽人均或评分</div>';
    return;
  }

  $("#list").innerHTML = list.map(r => {
    const s = statsFor(r);
    return '<article class="card' + (state.selectedId === r.id ? " sel" : "") + '" data-id="' + r.id + '">' +
      '<div class="card-top"><h3>' + esc(r.name) + '</h3>' +
        '<div class="rate">' + (s.rating ? s.rating.toFixed(1) : "—") +
        '<small>' + (s.rating ? "/5" : "") + '</small></div></div>' +
      '<div class="card-meta">' +
        '<span class="tag" style="--c:' + cuColor(r.cuisine) + '">' + esc(r.cuisine) + '</span>' +
        '<span>¥' + r.price + '/人</span>' +
        '<span class="sep">·</span>' +
        '<span>' + (s.count ? s.count + " 条评价" : "暂无评价") + '</span>' +
      '</div>' +
      '<div class="card-addr">' + esc(r.addr || "地址待补充") + '</div>' +
    '</article>';
  }).join("");
}

/* =========================================================
   6. 详情
   ========================================================= */
function openDetail(id){
  const r = findRest(id);
  if(!r) return;
  state.selectedId = id;
  state.tempStars = 5;
  const s = statsFor(r);

  $("#dheadInner").innerHTML =
    '<h2>' + esc(r.name) + '</h2>' +
    '<div class="dstats">' +
      (s.rating
        ? '<div class="cell"><div class="big">' + s.rating.toFixed(1) + '</div><div class="lbl">综合评分</div></div>'
        : '<div class="cell"><div class="big none">暂无</div><div class="lbl">综合评分</div></div>') +
      '<div class="cell"><div class="val">¥' + r.price + '</div><div class="lbl">人均</div></div>' +
      '<div class="cell"><div class="val">' + esc(r.cuisine) + '</div><div class="lbl">菜系</div></div>' +
      '<div class="cell"><div class="val">' + (s.count || 0) + '</div><div class="lbl">评价数</div></div>' +
    '</div>' +
    '<div class="daddr">' +
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1d1c1a" stroke-width="2"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>' +
      '<span>' + esc(r.addr || "地址待补充") + '</span>' +
    '</div>' +
    ((r.tags && r.tags.length)
      ? '<div class="dtags">' + r.tags.map(t => '<span>#' + esc(t) + '</span>').join("") + '</div>'
      : "");

  renderReviews(r);
  $("#detail").classList.add("open");
  try{ history.replaceState(null, "", "#id=" + id); }catch(e){}
  drawMarkers();
  // 详情栏会盖住地图右侧，所以定位时把目标点往左挪半个栏宽
  if(map){
    const z = Math.max(map.getZoom(), 15);
    const p = map.project(L.latLng(toMap(r.lat, r.lng)), z);
    if(window.innerWidth > 900) p.x += 226;
    map.flyTo(map.unproject(p, z), z, { duration: .55 });
  }
  renderList();
}

function renderReviews(r){
  const all = reviewsFor(r.id);
  const mine = userRevs[r.id] || [];

  const listHTML = all.length
    ? all.map(rv => {
        const mineFlag = mine.some(x => x.id === rv.id);
        return '<div class="rev">' +
          '<div class="rev-top">' +
            '<div class="avatar">' + esc(String(rv.user || "客").slice(0, 1)) + '</div>' +
            '<b>' + esc(rv.user || "匿名") + '</b>' +
            '<span class="stars">' + stars(rv.stars) + '</span>' +
            '<time>' + esc(fmt(rv.ts)) + '</time>' +
          '</div>' +
          '<p>' + esc(rv.text) + '</p>' +
          (mineFlag ? '<button class="delrev" data-del="' + rv.id + '">删除</button>' : '') +
        '</div>';
      }).join("")
    : '<div class="empty" style="padding:22px 0">还没有人写评价，做第一个吧</div>';

  $("#dbody").innerHTML =
    '<div class="sect"><h4>评价<em>' + all.length + '</em></h4>' + listHTML + '</div>' +
    '<div class="sect"><h4>写一条评价</h4>' +
      '<div class="form">' +
        '<div class="field"><label>昵称</label>' +
          '<input type="text" id="rvUser" placeholder="我" maxlength="12" value="我"></div>' +
        '<div class="field"><label>打分</label>' +
          '<div class="starpick" id="starpick">' +
            [1,2,3,4,5].map(i => '<span data-star="' + i + '" class="' + (i <= 5 ? "on" : "") + '">★</span>').join("") +
          '</div></div>' +
        '<div class="field"><label>说点什么</label>' +
          '<textarea id="rvText" placeholder="这家店好在哪？值得点什么？排队久吗？" maxlength="300"></textarea></div>' +
        '<button class="btn" id="btnSubmitRev">提交评价</button>' +
      '</div>' +
    '</div>';
}

function paintStars(n){
  state.tempStars = n;
  document.querySelectorAll("#starpick span").forEach(el => {
    el.classList.toggle("on", Number(el.dataset.star) <= n);
  });
}

/* =========================================================
   7. 交互绑定
   ========================================================= */
function availableCuisines(){
  const set = new Set();
  allRest().forEach(r => { if(r.city === state.city) set.add(r.cuisine); });
  return CUISINES.filter(c => set.has(c));
}

function renderCuisineFilters(){
  const list = availableCuisines();
  $("#cuisineChips").innerHTML =
    '<button class="chip' + (state.cuisines.size ? "" : " on") + '" data-cu="__all">全部</button>' +
    list.map(c =>
      '<button class="chip' + (state.cuisines.has(c) ? " on" : "") + '" data-cu="' + c +
      '"><i class="dot" style="background:' + cuColor(c) + '"></i>' + c + "</button>"
    ).join("");

  const legend = $("#legend");
  if(legend) legend.innerHTML =
    list.map(c => '<i><span class="dot" style="background:' + cuColor(c) + '"></span>' + c + "</i>").join("") +
    '<i style="color:#a89f8f;margin-left:2px">点越大 · 评价越多</i>';
}

function bindUI(){
  // 城市切换
  $("#cityChips").innerHTML = CITIES.map(c =>
    '<button class="chip' + (c === state.city ? " on" : "") + '" data-city="' + c + '">' + c + "</button>"
  ).join("");

  $("#cityChips").addEventListener("click", e => {
    const btn = e.target.closest(".chip");
    if(btn) switchCity(btn.dataset.city);
  });

  // 菜系 chips（只列当前城市有的）
  renderCuisineFilters();

  $("#cuisineChips").addEventListener("click", e => {
    const btn = e.target.closest(".chip");
    if(!btn) return;
    const cu = btn.dataset.cu;
    if(cu === "__all"){
      state.cuisines.clear();
    }else{
      if(state.cuisines.has(cu)) state.cuisines.delete(cu);
      else state.cuisines.add(cu);
    }
    renderCuisineFilters();
    refresh();
  });

  $("#q").addEventListener("input", e => {
    state.q = e.target.value;
    refresh();
  });

  $("#priceSel").addEventListener("change", e => { state.price = e.target.value; refresh(); });
  $("#rateSel").addEventListener("change", e => { state.minRate = Number(e.target.value); refresh(); });
  $("#sortSel").addEventListener("change", e => { state.sort = e.target.value; refresh(); });

  // 移动端展开更多筛选
  $("#fmore").addEventListener("click", function(){
    const box = $("#moreFilters");
    box.classList.toggle("open");
    const on = box.classList.contains("open");
    this.classList.toggle("on", on);
    this.textContent = on ? "收起筛选 ▴" : "更多筛选 ▾";
  });

  $("#list").addEventListener("click", e => {
    const card = e.target.closest(".card");
    if(card) openDetail(card.dataset.id);
  });

  $("#btnClose").addEventListener("click", closeDetail);

  // 详情内事件委托
  $("#dbody").addEventListener("click", e => {
    const star = e.target.closest("[data-star]");
    if(star){ paintStars(Number(star.dataset.star)); return; }

    const del = e.target.closest("[data-del]");
    if(del){
      const id = state.selectedId;
      userRevs[id] = (userRevs[id] || []).filter(x => x.id !== del.dataset.del);
      if(!userRevs[id].length) delete userRevs[id];
      saveJSON(LS_REV, userRevs);
      const r = findRest(id);
      if(r){ renderReviews(r); openDetailStatsOnly(r); }
      drawMarkers(); renderList();
      return;
    }

    if(e.target.id === "btnSubmitRev"){
      const text = $("#rvText").value.trim();
      if(!text){ $("#rvText").focus(); $("#rvText").style.borderColor = "#c8452a"; return; }
      const id = state.selectedId;
      const user = ($("#rvUser").value.trim() || "我").slice(0, 12);
      userRevs[id] = userRevs[id] || [];
      userRevs[id].push({
        id: "u" + Date.now() + Math.random().toString(36).slice(2, 6),
        user: user, stars: state.tempStars, text: text, ts: Date.now()
      });
      saveJSON(LS_REV, userRevs);
      const r = findRest(id);
      if(r){ renderReviews(r); openDetailStatsOnly(r); }
      drawMarkers(); renderList();
      toast("评价已保存");
    }
  });

  // 底图切换
  $("#bmAmap").addEventListener("click", () => setBasemap("amap"));
  $("#bmOsm").addEventListener("click", () => setBasemap("osm"));

  // 添加餐厅
  $("#fCuisine").innerHTML = CUISINES.map(c => '<option>' + c + '</option>').join("");
  $("#fCity").innerHTML = CITIES.map(c => '<option>' + c + '</option>').join("");
  $("#btnAdd").addEventListener("click", e => { e.preventDefault(); openModal(); });
  $("#btnCancel").addEventListener("click", closeModal);
  $("#btnPick").addEventListener("click", startPick);
  $("#btnSave").addEventListener("click", saveRestaurant);
  $("#modal").addEventListener("click", e => { if(e.target.id === "modal") closeModal(); });

  // 导出 / 重置
  $("#btnExport").addEventListener("click", e => {
    e.preventDefault();
    const data = { restaurants: customRest, reviews: userRevs, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "chishenme-data.json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast("已导出 JSON");
  });

  $("#btnReset").addEventListener("click", e => {
    e.preventDefault();
    if(!confirm("确定清空本机添加的餐厅和评价？此操作不可撤销。")) return;
    localStorage.removeItem(LS_REST);
    localStorage.removeItem(LS_REV);
    customRest = []; userRevs = {};
    state.selectedId = null;
    closeDetail(); refresh(); toast("本机数据已清空");
  });

  // 移动端抽屉
  $("#grab").addEventListener("click", () => {
    $("#panel").classList.toggle("collapsed");
  });
  $("#mpill").addEventListener("click", () => {
    $("#panel").classList.toggle("collapsed");
  });
  if(window.matchMedia("(max-width: 900px)").matches){
    $("#panel").classList.add("collapsed");
  }

  // Esc
  document.addEventListener("keydown", e => {
    if(e.key === "Escape"){
      if(state.pickMode){ endPick(); $("#modal").classList.add("open"); }
      else if($("#modal").classList.contains("open")) closeModal();
      else closeDetail();
    }
  });

  window.addEventListener("resize", () => { if(map) map.invalidateSize(); });
}

function openDetailStatsOnly(r){
  const s = statsFor(r);
  const big = $("#dheadInner .big");
  if(big){
    if(s.rating){ big.textContent = s.rating.toFixed(1); big.classList.remove("none"); }
    else { big.textContent = "暂无"; big.classList.add("none"); }
  }
  const cells = $("#dheadInner .dstats").children;
  if(cells[3]) cells[3].querySelector(".val").textContent = s.count || 0;
  const h4 = $("#dbody h4 em");
  if(h4) h4.textContent = reviewsFor(r.id).length;
}

function closeDetail(){
  state.selectedId = null;
  $("#detail").classList.remove("open");
  try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
  drawMarkers(); renderList();
}

function switchCity(city){
  if(!CITY_DATA[city]) return;
  state.city = city;
  state.selectedId = null;
  state.cuisines.clear();

  document.querySelectorAll("#cityChips .chip").forEach(b => {
    b.classList.toggle("on", b.dataset.city === city);
  });
  renderCuisineFilters();

  $("#brandSeal").textContent = CITY_ABBR[city] || city.slice(0, 1);
  $("#brandTitle").textContent = city + "美食地图";
  document.title = city + "美食地图";

  $("#detail").classList.remove("open");
  try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}

  const v = CITY_VIEW[city];
  if(map && v) map.setView(toMap(v.center[0], v.center[1]), v.zoom);

  renderList();
  drawMarkers();
}

/* =========================================================
   8. 新增餐厅
   ========================================================= */
function openModal(){
  state.newLat = null; state.newLng = null;
  $("#fName").value = ""; $("#fAddr").value = "";
  $("#fPrice").value = ""; $("#fRate").value = "";
  $("#fCity").value = state.city;
  $("#fCoord").textContent = "未选择";
  if(pickMarker && map){ map.removeLayer(pickMarker); pickMarker = null; }
  $("#modal").classList.add("open");
  setTimeout(() => $("#fName").focus(), 80);
}
function closeModal(){
  $("#modal").classList.remove("open");
  $("#modal").classList.remove("hiding");
  if(state.pickMode) endPick();
}
function startPick(){
  state.pickMode = true;
  $("#modal").classList.add("hiding");
  $("#pickbar").classList.add("on");
  if(map) map.getContainer().style.cursor = "crosshair";
}
function endPick(){
  state.pickMode = false;
  $("#pickbar").classList.remove("on");
  if(map) map.getContainer().style.cursor = "";
}

function saveRestaurant(){
  const name = $("#fName").value.trim();
  const price = Number($("#fPrice").value);
  const cuisine = $("#fCuisine").value;
  const city = $("#fCity").value;

  if(!name){ $("#fName").style.borderColor = "#c8452a"; $("#fName").focus(); return; }
  if(!(price >= 0) || $("#fPrice").value === ""){ $("#fPrice").style.borderColor = "#c8452a"; $("#fPrice").focus(); return; }

  const rate = Math.max(0, Math.min(5, Number($("#fRate").value) || 0));
  let lat = state.newLat, lng = state.newLng;
  if(lat == null){
    // 没选点：放在地图中心
    const c = map ? map.getCenter() : { lat: 31.2260, lng: 121.4700 };
    if(state.basemap === "amap"){ const g = gcj2wgs(c.lng, c.lat); lng = g[0]; lat = g[1]; }
    else { lat = c.lat; lng = c.lng; }
  }

  const r = {
    id: "c" + Date.now(),
    name: name.slice(0, 30),
    city: city,
    cuisine: cuisine,
    price: Math.round(price),
    rating: rate,
    count: rate > 0 ? 1 : 0,
    addr: $("#fAddr").value.trim().slice(0, 60),
    lat: lat, lng: lng,
    tags: ["我添加的"],
    reviews: [],
    custom: true
  };

  customRest.push(r);
  saveJSON(LS_REST, customRest);
  closeModal();
  if(city !== state.city) switchCity(city);
  refresh();
  openDetail(r.id);
  toast("已添加「" + r.name + "」");
}

/* =========================================================
   9. 轻提示
   ========================================================= */
let toastTimer = null;
function toast(msg){
  let el = $("#toast");
  if(!el){
    el = document.createElement("div");
    el.id = "toast";
    el.style.cssText = "position:fixed;left:50%;bottom:88px;transform:translate(-50%,10px);" +
      "background:#1d1c1a;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;" +
      "z-index:1200;opacity:0;transition:.22s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:80vw;text-align:center";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  requestAnimationFrame(() => { el.style.opacity = "1"; el.style.transform = "translate(-50%,0)"; });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.style.opacity = "0";
    el.style.transform = "translate(-50%,10px)";
  }, 1900);
}

/* =========================================================
   10. 启动
   ========================================================= */
function refresh(){
  renderCuisineFilters();
  renderList();
  drawMarkers();
}

function boot(){
  bindUI();
  initMap();
  refresh();
  // 支持 #id=d15 这种直达链接（跨城市也能打开）
  const m = /^#id=([\w-]+)$/.exec(location.hash || "");
  if(m){
    const r = findRest(m[1]);
    if(r){
      if(r.city !== state.city) switchCity(r.city);
      setTimeout(() => openDetail(r.id), 120);
    }
  }
}

/* Leaflet：多 CDN 兜底加载 */
(function(){
  const cssList = [
    "https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css",
    "https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.css",
    "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  ];
  cssList.forEach(h => {
    const l = document.createElement("link");
    l.rel = "stylesheet"; l.href = h;
    document.head.appendChild(l);
  });

  if(window.L){ boot(); return; }

  const jsList = [
    "https://cdn.jsdelivr.net/npm/leaflet@1.9.4/leaflet.js",
    "https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.js",
    "https://unpkg.com/leaflet@1.9.4/leaflet.js"
  ];
  let i = 0;
  (function tryLoad(){
    if(i >= jsList.length){
      // 全部失败：降级为纯列表模式
      bindUI();
      refresh();
      const el = document.createElement("div");
      el.style.cssText = "position:absolute;inset:0;display:grid;place-items:center;padding:40px;text-align:center;" +
        "color:#938d82;font-size:14px;line-height:1.9;background:#f2ece1;z-index:2";
      el.innerHTML = "地图库加载失败（网络问题）<br>左侧筛选和列表、评价功能仍然可用。<br><br>" +
        '<span style="font-size:12px;opacity:.7">请检查网络后刷新，或把页面放到有网的浏览器打开</span>';
      $("#mapwrap").appendChild(el);
      return;
    }
    const s = document.createElement("script");
    s.src = jsList[i++];
    s.onload = function(){ boot(); };
    s.onerror = tryLoad;
    document.head.appendChild(s);
  })();
})();
</script>
