<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>上海美食地图</title>
<meta name="description" content="按菜系、人均、评分筛上海餐厅，地图上一眼看清。可以自己上传餐厅、补充评价。">
<meta name="theme-color" content="#c8452a">
<meta property="og:type" content="website">
<meta property="og:title" content="上海美食地图">
<meta property="og:description" content="按菜系、人均、评分筛上海餐厅，地图上一眼看清。">
<meta property="og:locale" content="zh_CN">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c8452a'/%3E%3Cpath d='M32 14c-7.7 0-14 6.1-14 13.7 0 10.3 14 22.3 14 22.3s14-12 14-22.3C46 20.1 39.7 14 32 14z' fill='%23fff'/%3E%3Ccircle cx='32' cy='27.5' r='5' fill='%23c8452a'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#1d1c1a; --ink2:#5b5750; --ink3:#938d82;
  --paper:#fffdf9; --line:#e9e2d5; --accent:#c8452a; --green:#1f4f45;
  --bg:#f2ece1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);background:var(--bg);overflow:hidden;
  -webkit-font-smoothing:antialiased;font-size:14px;
}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#d8d0c1;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

#app{display:flex;height:100vh;height:100dvh}

/* ---------------- 左栏 ---------------- */
#panel{
  width:392px;flex:none;display:flex;flex-direction:column;
  background:var(--paper);border-right:1px solid var(--line);z-index:30;
}
.phead{padding:16px 18px 0;flex:none}
.brand{display:flex;align-items:center;gap:10px}
.seal{
  width:34px;height:34px;flex:none;border-radius:9px;background:var(--accent);
  color:#fff;display:grid;place-items:center;font-size:17px;font-weight:700;
  letter-spacing:0;box-shadow:0 3px 10px rgba(200,69,42,.28);
}
.brand h1{margin:0;font-size:19px;letter-spacing:.5px;font-weight:700}
.brand .sub{font-size:11px;color:var(--ink3);margin-top:2px;letter-spacing:.3px}
.mpill{display:none}
.demo-note{
  margin:12px 0 0;padding:7px 10px;border-radius:8px;background:#fdf3ea;
  border:1px solid #f3ddc8;color:#9a5a2c;font-size:11.5px;line-height:1.5;
}

.search{
  margin-top:14px;position:relative;
}
.search input{
  width:100%;height:38px;border:1px solid var(--line);border-radius:10px;
  padding:0 12px 0 34px;background:#fff;outline:none;
}
.search input:focus{border-color:#cbbfa8;box-shadow:0 0 0 3px rgba(200,69,42,.07)}
.search svg{position:absolute;left:11px;top:11px;opacity:.4}
.search.dest{margin-top:8px}
.search.dest input{height:34px;font-size:13px;background:#fbf7ef;padding-left:32px}
.search.dest input:focus{background:#fff}
.search.dest svg{top:9px;left:10px}

.destbar{
  display:none;margin-top:8px;align-items:center;gap:7px;
  background:#fdf3ea;border:1px solid #f0d9c2;border-radius:9px;
  padding:7px 9px 7px 11px;font-size:12.5px;color:#8a4a22;
}
.destbar.on{display:flex}
.destbar .dname{
  font-weight:700;color:var(--accent);max-width:140px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.destbar .dcount{color:#9a5a2c;white-space:nowrap}
.destbar button{
  margin-left:auto;border:none;background:none;color:#b06a3c;
  font-size:15px;line-height:1;padding:2px 4px;border-radius:5px;
}
.destbar button:hover{background:#f6e2cd}
#cityChips.locked{opacity:.38;pointer-events:none}

.filters{padding:12px 18px 0;flex:none}
.frow{display:flex;gap:8px;margin-bottom:9px;align-items:center}
.frow>label{font-size:11.5px;color:var(--ink3);width:38px;flex:none;letter-spacing:.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--line);background:#fff;border-radius:99px;
  padding:4.5px 11px;font-size:12px;color:var(--ink2);transition:.15s;
  display:inline-flex;align-items:center;gap:5px;
}
.chip:hover{border-color:#cfc4ae}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:none}
#cityChips{gap:5px}
#cityChips .chip{padding:4px 9px;font-size:12px}
select.mini{
  height:31px;border:1px solid var(--line);border-radius:8px;background:#fff;
  padding:0 8px;font-size:12.5px;color:var(--ink2);outline:none;flex:1;min-width:0;
}

.listbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 18px 8px;border-bottom:1px solid var(--line);flex:none;margin-top:4px;
}
.listbar b{color:var(--accent);font-size:15px}
.listbar span{font-size:12px;color:var(--ink3)}

.fmore{display:none}

#list{flex:1;overflow-y:auto;padding:10px 14px 18px;overscroll-behavior:contain}
.card{
  background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;margin-bottom:9px;cursor:pointer;transition:.16s;
  position:relative;overflow:hidden;
}
.card:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(60,45,20,.08);border-color:#ded4c2}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.card.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.card-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card-top h3{margin:0;font-size:14.5px;font-weight:600;line-height:1.3}
.rate{
  font-size:15px;font-weight:700;color:var(--accent);flex:none;
  font-variant-numeric:tabular-nums;letter-spacing:-.3px;
}
.rate small{font-size:9px;font-weight:500;color:var(--ink3);margin-left:2px}
.card-meta{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:11.5px;color:var(--ink2);flex-wrap:wrap}
.tag{
  background:color-mix(in srgb, var(--c) 12%, #fff);
  color:var(--c);border:1px solid color-mix(in srgb, var(--c) 28%, #fff);
  border-radius:5px;padding:1px 6px;font-size:11px;font-weight:600;
}
.sep{color:#d5cdc0}
.card-addr{margin-top:5px;font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--ink3);font-size:13px;padding:42px 20px;line-height:1.7}

.pfoot{
  flex:none;padding:9px 18px;border-top:1px solid var(--line);
  display:flex;gap:14px;align-items:center;background:#faf6ee;font-size:11.5px;
}
.pfoot a{color:var(--ink3);text-decoration:none;border-bottom:1px dotted #c9c0af;padding-bottom:1px}
.pfoot a:hover{color:var(--accent);border-color:var(--accent)}
.pfoot .sp{flex:1}

/* ---------------- 地图 ---------------- */
#mapwrap{flex:1;position:relative;background:#e7e2d6}
#map{position:absolute;inset:0;z-index:1}
.legend{
  position:absolute;left:14px;bottom:22px;z-index:400;background:rgba(255,253,249,.94);
  border:1px solid var(--line);border-radius:10px;padding:9px 11px;
  display:flex;flex-wrap:wrap;gap:4px 10px;max-width:330px;
  font-size:11px;color:var(--ink2);backdrop-filter:blur(6px);
  box-shadow:0 4px 14px rgba(60,45,20,.09);
}
.legend i{display:inline-flex;align-items:center;gap:4px;font-style:normal}
.legend .dot{width:8px;height:8px;border-radius:50%}
.mapbtn{
  position:absolute;right:14px;top:14px;z-index:400;display:flex;gap:6px;
}
.mapbtn button{
  background:rgba(255,253,249,.95);border:1px solid var(--line);border-radius:9px;
  height:32px;padding:0 11px;font-size:12px;color:var(--ink2);
  box-shadow:0 4px 12px rgba(60,45,20,.1);
}
.mapbtn button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#pickbar{
  position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:800;
  background:var(--ink);color:#fff;border-radius:99px;padding:9px 18px;
  font-size:13px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.28);white-space:nowrap;
}
#pickbar.on{display:block}
#pickbar b{color:#ffd28a}

/* ---------------- 详情 ---------------- */
#detail{
  position:absolute;top:0;right:0;height:100%;width:452px;max-width:100%;
  background:var(--paper);z-index:600;border-left:1px solid var(--line);
  display:flex;flex-direction:column;transform:translateX(101%);
  transition:transform .3s cubic-bezier(.32,.72,.28,1);
  box-shadow:-16px 0 40px rgba(60,45,20,.13);
}
#detail.open{transform:none}
.dhead{flex:none;padding:16px 18px 14px;border-bottom:1px solid var(--line);position:relative}
.close{
  position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;
  border:none;background:#f1ebe0;color:var(--ink2);font-size:16px;line-height:1;
}
.close:hover{background:#e6dece}
.dhead h2{margin:0 40px 8px 0;font-size:20px;letter-spacing:.3px}
.dstats{display:flex;gap:16px;align-items:flex-end;margin-top:4px}
.big{font-size:30px;font-weight:700;color:var(--accent);line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.big.none{font-size:20px;color:var(--ink3);letter-spacing:0}
.dstats .lbl{font-size:11px;color:var(--ink3);margin-bottom:3px}
.dstats .cell{display:flex;flex-direction:column;gap:3px}
.dstats .val{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.daddr{margin-top:12px;font-size:12.5px;color:var(--ink2);display:flex;gap:6px;align-items:flex-start;line-height:1.5}
.daddr svg{flex:none;margin-top:2px;opacity:.5}
.dtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dtags span{background:#f4efe4;border-radius:6px;padding:3px 8px;font-size:11.5px;color:var(--ink2)}

.dact{margin-top:13px;display:flex;gap:8px}
.navbtn{
  flex:1;height:38px;border:none;border-radius:9px;background:var(--green);color:#fff;
  font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  transition:.15s;
}
.navbtn:hover{background:#17453b}

.navopt{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  border:1px solid var(--line);border-radius:10px;background:#fff;
  padding:10px 12px;margin-bottom:8px;transition:.14s;
}
.navopt:last-of-type{margin-bottom:0}
.navopt:hover{border-color:#cfc4ae;background:#fdfaf3}
.navopt .ico{
  width:34px;height:34px;border-radius:9px;flex:none;
  display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;letter-spacing:-.5px;
}
.navopt .txt{flex:1;min-width:0}
.navopt .t1{font-size:13.5px;font-weight:600;color:var(--ink)}
.navopt .t2{font-size:11.5px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#dbody{flex:1;overflow-y:auto;padding:16px 18px 28px;overscroll-behavior:contain}
.sect{margin-bottom:22px}
.sect h4{
  margin:0 0 11px;font-size:12px;color:var(--ink3);font-weight:600;
  letter-spacing:1.4px;text-transform:uppercase;
}
.sect h4 em{font-style:normal;color:var(--accent);margin-left:4px;letter-spacing:0}

.rev{border-bottom:1px dashed #ece5d8;padding:11px 0 12px;position:relative}
.rev:last-child{border-bottom:none}
.rev-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.avatar{
  width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;
  display:grid;place-items:center;font-size:11px;font-weight:600;flex:none;
}
.rev-top b{font-size:12.5px;font-weight:600}
.rev-top time{font-size:11px;color:var(--ink3);margin-left:auto}
.stars{color:#e2a33c;font-size:12px;letter-spacing:1px}
.rev p{margin:0;font-size:13px;line-height:1.65;color:var(--ink2);white-space:pre-wrap;word-break:break-word}
.delrev{
  position:absolute;right:0;bottom:9px;border:none;background:none;color:#c3b9a8;
  font-size:11px;padding:2px 4px;
}
.delrev:hover{color:var(--accent)}

.form{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.form .field{margin-bottom:11px}
.form .field:last-of-type{margin-bottom:0}
.form label{display:block;font-size:11.5px;color:var(--ink3);margin-bottom:5px}
.form input[type=text],.form textarea{
  width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;
  background:#fefcf8;outline:none;transition:.15s;
}
.form input[type=text]:focus,.form textarea:focus{border-color:#cbbfa8;background:#fff}
.form textarea{resize:vertical;min-height:70px;line-height:1.6}
.starpick{display:flex;gap:3px;font-size:26px;line-height:1;user-select:none}
.starpick span{color:#e4dccd;cursor:pointer;transition:.12s}
.starpick span.on{color:#e2a33c}
.starpick span:hover{transform:scale(1.12)}
.btn{
  border:none;border-radius:9px;height:38px;padding:0 18px;font-size:13.5px;
  font-weight:600;background:var(--ink);color:#fff;transition:.15s;width:100%;
}
.btn:hover{background:#000}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink2);border:1px solid var(--line)}
.btn.ghost:hover{background:#f8f3e9;color:var(--ink)}
.btn.sm{height:33px;font-size:12.5px;padding:0 14px;width:auto}

/* ---------------- 弹窗 ---------------- */
.modal{
  position:fixed;inset:0;background:rgba(28,22,14,.5);z-index:900;
  display:none;align-items:center;justify-content:center;padding:18px;
  backdrop-filter:blur(2px);
}
.modal.open{display:flex}
.modal.hiding{display:none}
.mcard{
  background:var(--paper);border-radius:16px;width:100%;max-width:470px;
  max-height:88vh;overflow-y:auto;padding:20px 20px 18px;
  box-shadow:0 24px 60px rgba(0,0,0,.3);
}
.mcard h3{margin:0 0 4px;font-size:17px}
.mcard .hint{font-size:11.5px;color:var(--ink3);margin:0 0 16px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mrow{margin-bottom:11px}
.mrow label{display:block;font-size:11.5px;color:var(--ink3);margin-bottom:5px}
.mrow label i{color:var(--accent);font-style:normal}
.mrow input,.mrow select{
  width:100%;height:37px;border:1px solid var(--line);border-radius:8px;
  padding:0 10px;background:#fff;outline:none;
}
.mrow input:focus,.mrow select:focus{border-color:#cbbfa8;box-shadow:0 0 0 3px rgba(200,69,42,.07)}

.combo{position:relative}
.sug{
  display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;
  background:#fff;border:1px solid var(--line);border-radius:10px;
  box-shadow:0 12px 30px rgba(60,45,20,.18);max-height:224px;overflow-y:auto;
}
.sug.on{display:block}
.sug .item{padding:8px 11px;cursor:pointer;border-bottom:1px solid #f5f0e5}
.sug .item:last-child{border-bottom:none}
.sug .item:hover,.sug .item:active{background:#fdf3ea}
.sug .nm{font-size:13px;font-weight:600;line-height:1.35}
.sug .ad{
  font-size:11.5px;color:var(--ink3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sug .hint{padding:11px;font-size:12px;color:var(--ink3);text-align:center}
.picked{
  display:none;margin-top:6px;font-size:11.5px;line-height:1.5;color:#1c7a5a;
}
.picked.on{display:block}
.picked.warn{color:var(--accent)}
.coordbox{
  display:flex;gap:8px;align-items:center;background:#f7f2e7;border:1px dashed #ddd2bd;
  border-radius:9px;padding:9px 11px;font-size:12px;color:var(--ink2);
}
.coordbox b{font-variant-numeric:tabular-nums;color:var(--ink)}
.mactions{display:flex;gap:9px;margin-top:18px}
.mactions .btn{flex:1}

.linkbtn{
  margin-top:12px;border:1px solid var(--line);background:#fff;border-radius:9px;
  padding:7px 16px;font-size:13px;color:var(--accent);font-weight:600;
}
.linkbtn:hover{background:#fdf3ea;border-color:#f0d3bb}

/* ---------------- 聚簇 ---------------- */
.clwrap{background:none;border:none}
.cl{
  display:grid;place-items:center;border-radius:50%;
  background:#fff;color:#1d1c1a;font-weight:700;letter-spacing:-.5px;
  border:3px solid var(--c);box-shadow:0 3px 12px rgba(40,30,10,.22);
  transition:transform .15s;font-variant-numeric:tabular-nums;
}
.cl:hover{transform:scale(1.09)}

/* ---------------- 移动端 ---------------- */
.grab{display:none}
@media (max-width: 900px){
  #app{flex-direction:column}
  #mapwrap{position:absolute;inset:0}
  #panel{
    position:absolute;left:0;right:0;bottom:0;width:auto;height:62vh;
    border-right:none;border-top:1px solid var(--line);
    border-radius:18px 18px 0 0;
    box-shadow:0 -10px 34px rgba(60,45,20,.18);
    transition:height .28s cubic-bezier(.32,.72,.28,1);
    padding-bottom:env(safe-area-inset-bottom);
  }
  #panel.collapsed{height:86px}
  #panel.collapsed .search{display:none}
  #panel.collapsed .phead{padding-bottom:7px}
  #moreFilters{display:none}
  #moreFilters.open{display:block}
  #expHint{display:none}
  .fmore{
    display:inline-flex;align-items:center;gap:3px;
    border:1px solid var(--line);background:#fff;border-radius:99px;
    padding:4px 10px;font-size:11.5px;color:var(--ink2);
  }
  .fmore.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .mpill{
    display:inline-flex;align-items:center;gap:4px;margin-left:auto;
    background:#f4eee2;border-radius:99px;padding:4px 10px;
    font-size:11.5px;color:var(--ink2);font-weight:600;
  }
  .grab{
    display:block;height:22px;flex:none;cursor:pointer;position:relative;
  }
  .grab::after{
    content:"";position:absolute;left:50%;top:8px;transform:translateX(-50%);
    width:38px;height:4px;border-radius:4px;background:#d9d0bf;
  }
  .phead{padding-top:4px}
  .brand h1{font-size:17px}
  .demo-note{display:none}
  .seal{width:30px;height:30px;font-size:15px}
  .legend{display:none}
  .mapbtn{top:auto;bottom:calc(62vh + 12px);right:12px;flex-direction:column}
  .mapbtn button{height:30px;padding:0 10px;font-size:11.5px}
  #panel.collapsed ~ #mapwrap .mapbtn{bottom:calc(86px + 12px)}
  #detail{width:100%;border-left:none}
  .filters{padding-top:9px}
  #list{padding:8px 12px 14px}
  .card{padding:10px 12px}
}

@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<div id="app">
  <!-- 左栏 -->
  <aside id="panel">
    <div class="grab" id="grab"></div>
    <div class="phead">
      <div class="brand">
        <div class="seal" id="brandSeal">沪</div>
        <div>
          <h1 id="brandTitle">上海美食地图</h1>
          <div class="sub">按菜系 · 人均 · 评分找店</div>
        </div>
        <span class="mpill" id="mpill">0 家</span>
      </div>
      <p class="demo-note">还没有收录任何餐厅。你添加的内容只保存在这台设备的浏览器里，换设备或清缓存就会消失。</p>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1d1c1a" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="搜餐厅名、菜系、地址…" autocomplete="off">
      </div>
      <div class="search dest">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1d1c1a" stroke-width="2.2"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>

/* =========================================================
   1b. 持久化层
   配了 Supabase 就走云端（所有人共享），没配就退回本机 localStorage。
   两种模式对上层暴露同一组接口，业务代码不用关心后端是谁。
   ========================================================= */
const SUPABASE_URL  = "https://vovzusarziwiimbkazqk.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvdnp1c2Fyeml3aWltYmthenFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNjUwMTQsImV4cCI6MjEwODk0MTAxNH0.Sd8Wdxk9DJegwjrivg-30hLx2skuvNsFmNa0Fnf6K9Y";

const LS_REST = "shmap.custom.v1";

const DEVICE_KEY = "shmap.device.v1";

function loadJSON(k, fb){
  try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; }
  catch(e){ return fb; }
}
function saveJSON(k, v){
  try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ console.warn("存储失败", e); }
}

/* 阶段一的轻量身份：一台设备一个 id，没有登录 */
const MY_DEVICE = (function(){
  let v = null;
  try{ v = localStorage.getItem(DEVICE_KEY); }catch(e){}
  if(!v){
    v = "d" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    try{ localStorage.setItem(DEVICE_KEY, v); }catch(e){}
  }
  return v;
})();

let customRest = [];
let userRevs   = {};

async function sbRequest(path, opts){
  const url = SUPABASE_URL.replace(/\/+$/, "") + "/rest/v1/" + path;
  const headers = {
    "apikey": SUPABASE_ANON,
    "Authorization": "Bearer " + SUPABASE_ANON,
    "Content-Type": "application/json"
  };
  Object.assign(headers, (opts && opts.headers) || {});

  // 网络不好时别让整个页面卡死
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 8000);
  let res;
  try{
    res = await fetch(url, Object.assign({}, opts, { headers, signal: ctl.signal }));
  }catch(e){
    throw new Error(e.name === "AbortError" ? "请求超时" : "网络不通");
  }finally{
    clearTimeout(timer);
  }

  if(!res.ok){
    let msg = "HTTP " + res.status;
    try{ const j = await res.json(); msg = j.message || j.hint || j.details || msg; }catch(e){}
    const err = new Error(msg);
    err.status = res.status;
    throw err;
  }
  if(res.status === 204) return null;
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

/* 服务端行 → 前端模型 */
function fromRow(row){
  return {
    id: row.id,
    name: row.name,
    city: row.city,
    cuisine: row.cuisine,
    price: row.price,
    addr: row.addr || "",
    lat: row.lat,
    lng: row.lng,
    tags: row.tags || [],
    rating: 0,
    count: 0,
    reviews: [],
    poi_id: row.poi_id || null,
    device: row.device_id || null,
    remote: true
  };
}

const store = {
  remote: !!(SUPABASE_URL && SUPABASE_ANON),

  async load(){
    if(!this.remote){
      customRest = loadJSON(LS_REST, []);
      userRevs = loadJSON(LS_REV, {});
      return "local";
    }
    const rows = await sbRequest("restaurants?select=*&status=eq.active&order=created_at.asc");
    customRest = (rows || []).map(fromRow);

    const revs = await sbRequest("reviews?select=*&status=eq.active&order=created_at.asc");
    userRevs = {};
    (revs || []).forEach(v => {
      (userRevs[v.restaurant_id] = userRevs[v.restaurant_id] || []).push({
        id: v.id,
        user: v.nickname || "匿名",
        stars: v.stars,
        text: v.body,
        ts: v.created_at,
        device: v.device_id
      });
    });
    return "remote";
  },

  async addRestaurant(r){
    if(!this.remote){
      customRest.push(r);
      saveJSON(LS_REST, customRest);
      return { item: r };
    }
    const payload = {
      name: r.name, city: r.city, cuisine: r.cuisine, price: r.price,
      addr: r.addr || null, lat: r.lat, lng: r.lng,
      tags: r.tags || [], device_id: MY_DEVICE, poi_id: r.poi_id || null
    };
    try{
      const rows = await sbRequest("restaurants", {
        method: "POST",
        headers: { "Prefer": "return=representation" },
        body: JSON.stringify(payload)
      });
      const item = fromRow(rows[0]);
      customRest.push(item);
      return { item };
    }catch(e){
      // 撞到同一个高德 POI：说明这家店已经有人加过了
      if(e.status === 409 && r.poi_id){
        const ex = await sbRequest("restaurants?select=*&poi_id=eq." + encodeURIComponent(r.poi_id));
        if(ex && ex.length){
          const item = fromRow(ex[0]);
          if(!customRest.some(x => x.id === item.id)) customRest.push(item);
          return { item: item, duplicate: true };
        }
      }
      throw e;
    }
  },

  async addReview(restaurantId, rev){
    if(!this.remote){
      (userRevs[restaurantId] = userRevs[restaurantId] || []).push(rev);
      saveJSON(LS_REV, userRevs);
      return rev;
    }
    const rows = await sbRequest("reviews", {
      method: "POST",
      headers: { "Prefer": "return=representation" },
      body: JSON.stringify({
        restaurant_id: restaurantId,
        device_id: MY_DEVICE,
        nickname: rev.user,
        stars: rev.stars,
        body: rev.text
      })
    });
    const v = rows[0];
    const item = {
      id: v.id, user: v.nickname || rev.user, stars: v.stars,
      text: v.body, ts: v.created_at, device: MY_DEVICE
    };
    (userRevs[restaurantId] = userRevs[restaurantId] || []).push(item);
    return item;
  },

  async deleteReview(restaurantId, reviewId){
    if(this.remote){
      await sbRequest("reviews?id=eq." + encodeURIComponent(reviewId), { method: "DELETE" });
    }
    userRevs[restaurantId] = (userRevs[restaurantId] || []).filter(x => x.id !== reviewId);
    if(!userRevs[restaurantId].length) delete userRevs[restaurantId];
    if(!this.remote) saveJSON(LS_REV, userRevs);
  },

  async reset(){
    if(!this.remote){
      try{ localStorage.removeItem(LS_REST); localStorage.removeItem(LS_REV); }catch(e){}
    }
    customRest = [];
    userRevs = {};
  }
};

/* =========================================================
   2. 状态与工具
   ========================================================= */
const state = {
  city: "上海",
  cuisines: new Set(),
  price: "all",
  minRate: 0,
  sort: "rating",
  q: "",
  basemap: "amap",
  selectedId: null,
  tempStars: 5,
  pickMode: false,
  newLat: null,
  newLng: null,
  newPoiId: null,
  dest: null          // 目的地筛选：{ name, lat, lng, radius }
};

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function allRest(){ return DEMO.concat(customRest); }
function findRest(id){ return allRest().find(r => r.id === id); }

function reviewsFor(id){
  const base = (findRest(id) || {}).reviews || [];
  return base.concat(userRevs[id] || []);
}
function statsFor(r){
  const mine = userRevs[r.id] || [];
  const n = (r.count || 0) + mine.length;
  if(!n) return { rating: 0, count: 0 };
  const sum = (r.count || 0) * (r.rating || 0) + mine.reduce((a, x) => a + x.stars, 0);
  return { rating: sum / n, count: n };
}
function cuColor(c){ return CU_COLOR[c] || "#7f8c8d"; }

const FMT = new Intl.DateTimeFormat("zh-CN", { year: "numeric", month: "2-digit", day: "2-digit" });
function fmt(ts){
  if(typeof ts === "number") return FMT.format(new Date(ts)).replace(/\//g, "-");
  return ts;
}
function stars(n){ return "★".repeat(Math.round(n)) + "☆".repeat(Math.max(0, 5 - Math.round(n))); }

/* WGS84 -> GCJ02（高德底图需要，否则点位会偏几百米） */
function wgs2gcj(lng, lat){
  const PI = Math.PI, a = 6378245.0, ee = 0.00669342162296594323;
  function tLat(x, y){
    let r = -100 + 2*x + 3*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
    r += (20*Math.sin(6*x*PI) + 20*Math.sin(2*x*PI)) * 2/3;
    r += (20*Math.sin(y*PI) + 40*Math.sin(y/3*PI)) * 2/3;
    r += (160*Math.sin(y/12*PI) + 320*Math.sin(y*PI/30)) * 2/3;
    return r;
  }
  function tLng(x, y){
    let r = 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
    r += (20*Math.sin(6*x*PI) + 20*Math.sin(2*x*PI)) * 2/3;
    r += (20*Math.sin(x*PI) + 40*Math.sin(x/3*PI)) * 2/3;
    r += (150*Math.sin(x/12*PI) + 300*Math.sin(x/30*PI)) * 2/3;
    return r;
  }
  let dLat = tLat(lng - 105, lat - 35), dLng = tLng(lng - 105, lat - 35);
  const radLat = lat / 180 * PI;
  let magic = Math.sin(radLat); magic = 1 - ee * magic * magic;
  const sq = Math.sqrt(magic);
  dLat = (dLat * 180) / ((a * (1 - ee)) / (magic * sq) * PI);
  dLng = (dLng * 180) / (a / sq * Math.cos(radLat) * PI);
  return [lng + dLng, lat + dLat];
}

/* 两点间球面距离，返回公里 */
function haversine(lat1, lng1, lat2, lng2){
  const R = 6371, rad = d => d * Math.PI / 180;
  const dLat = rad(lat2 - lat1), dLng = rad(lng2 - lng1);
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return 2 * R * Math.asin(Math.sqrt(a));
}

/* =========================================================
   3. 筛选
   ========================================================= */
/* 当前"范围"：有目的地就按半径跨城市取，否则按城市取 */
function scopeRest(){
  if(state.dest){
    const d = state.dest, km = d.radius / 1000;
    return allRest().filter(r =>
      r.lat != null && r.lng != null && haversine(r.lat, r.lng, d.lat, d.lng) <= km
    );
  }
  return allRest().filter(r => r.city === state.city);
}

function visible(){
  const q = state.q.trim().toLowerCase();
  let arr = scopeRest().filter(r => {
    if(state.cuisines.size && !state.cuisines.has(r.cuisine)) return false;

    if(state.price !== "all"){
      const [lo, hi] = state.price.split("-").map(Number);
      if(!(r.price >= lo && r.price < hi)) return false;
    }
    const s = statsFor(r);
    if(state.minRate > 0 && s.rating < state.minRate) return false;

    if(q){
      const hay = (r.name + " " + r.cuisine + " " + (r.addr || "") + " " + (r.tags || []).join(" ")).toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  });

  const S = {
    rating: (a, b) => statsFor(b).rating - statsFor(a).rating || statsFor(b).count - statsFor(a).count,
    count: (a, b) => statsFor(b).count - statsFor(a).count,
    priceAsc: (a, b) => a.price - b.price,
    priceDesc: (a, b) => b.price - a.price
  };
  return arr.sort(S[state.sort] || S.rating);
}

/* =========================================================
   4. 地图（高德 JSAPI 2.0，矢量渲染）
   ========================================================= */
let map = null, markers = [], pickMarker = null, hoverWin = null;

/* 站内数据是 WGS-84，高德要 GCJ-02，返回 [lng, lat] */
function amapPos(lat, lng){
  const g = wgs2gcj(lng, lat);
  return [g[0], g[1]];
}

function currentMapStyle(){
  return state.basemap === "osm" ? "amap://styles/whitesmoke" : "amap://styles/normal";
}

function initMap(){
  const v = CITY_VIEW[state.city] || CITY_VIEW["上海"];
  map = new AMap.Map("map", {
    zoom: v.zoom,
    center: amapPos(v.center[0], v.center[1]),
    viewMode: "2D",
    resizeEnable: true,
    mapStyle: currentMapStyle()
  });

  map.on("zoomend", drawMarkers);

  // 高德默认不带缩放按钮，按需加载 ToolBar
  AMap.plugin(["AMap.ToolBar"], function(){
    map.addControl(new AMap.ToolBar({ liteStyle: true, position: { top: "16px", left: "16px" } }));
  });

  map.on("click", function(e){
    if(!state.pickMode) return;
    const glng = e.lnglat.getLng(), glat = e.lnglat.getLat();
    const g = gcj2wgs(glng, glat);
    const lng = g[0], lat = g[1];

    state.newLat = lat; state.newLng = lng;
    if(pickMarker){ map.remove(pickMarker); pickMarker = null; }
    pickMarker = new AMap.CircleMarker({
      center: [glng, glat], radius: 9, strokeColor: "#c8452a", strokeWeight: 3,
      fillColor: "#c8452a", fillOpacity: .5, zIndex: 200
    });
    map.add(pickMarker);

    $("#fCoord").textContent = lat.toFixed(5) + ", " + lng.toFixed(5);
    setPicked({ ok: true, addr: "（手动在地图上选的点）", lat: lat, lng: lng });
    endPick();
    $("#modal").classList.add("open");
  });

  drawMarkers();
}

/* GCJ02 -> WGS84（反解，一次迭代够用） */
function gcj2wgs(lng, lat){
  const g = wgs2gcj(lng, lat);
  return [lng * 2 - g[0], lat * 2 - g[1]];
}

function clearMarkers(){
  if(map && markers.length) map.remove(markers);
  markers = [];
}

function drawMarkers(){
  if(!map) return;
  clearMarkers();

  const list = visible().filter(r => r.lat != null && r.lng != null);
  const z = map.getZoom();

  // 放大到足够级别就直接铺点，否则按屏幕网格聚簇
  if(z >= 15){
    markers = list.map(singleMarker);
    map.add(markers);
    return;
  }

  const GRID = 62;
  const groups = new Map();
  list.forEach(r => {
    const p = map.lngLatToContainer(amapPos(r.lat, r.lng));
    if(!p) return;
    const k = Math.floor(p.x / GRID) + ":" + Math.floor(p.y / GRID);
    if(!groups.has(k)) groups.set(k, []);
    groups.get(k).push(r);
  });

  groups.forEach(g => {
    if(g.length === 1){ markers.push(singleMarker(g[0])); return; }

    let slng = 0, slat = 0;
    g.forEach(r => { const p = amapPos(r.lat, r.lng); slng += p[0]; slat += p[1]; });
    const center = [slng / g.length, slat / g.length];

    // 这一片里占比最多的菜系，用来给圆环上色
    const tally = {};
    g.forEach(r => { tally[r.cuisine] = (tally[r.cuisine] || 0) + 1; });
    const topCu = Object.keys(tally).sort((a, b) => tally[b] - tally[a])[0];

    const size = Math.round(34 + Math.min(26, Math.sqrt(g.length) * 5.5));
    const m = new AMap.Marker({
      position: center,
      content: '<div class="cl" style="--c:' + cuColor(topCu) + ';width:' + size + 'px;height:' + size +
               'px;font-size:' + (g.length > 9 ? 13 : 14.5) + 'px">' + g.length + "</div>",
      offset: new AMap.Pixel(-size / 2, -size / 2),
      zIndex: 120,
      cursor: "pointer"
    });
    m.on("click", function(){
      map.setZoomAndCenter(Math.min(z + 2, 17), center);
    });
    markers.push(m);
  });
  map.add(markers);
}

function singleMarker(r){
  const s = statsFor(r);
  const base = 6 + Math.min(7, Math.sqrt(s.count || 0) / 5);
  const pos = amapPos(r.lat, r.lng);

  const m = new AMap.CircleMarker({
    center: pos,
    radius: base,
    strokeColor: "#fff",
    strokeWeight: 2,
    fillColor: cuColor(r.cuisine),
    fillOpacity: .92,
    zIndex: state.selectedId === r.id ? 110 : 100,
    cursor: "pointer",
    bubble: true
  });

  m.on("click", function(){ openDetail(r.id); });
  m.on("mouseover", function(){ showTip(r, pos); });
  m.on("mouseout", function(){ hideTip(); });

  return m;
}

function showTip(r, pos){

  const s = statsFor(r);
  if(!hoverWin){
    hoverWin = new AMap.InfoWindow({ isCustom: true, offset: new AMap.Pixel(0, -4) });

}

/* 高德 key：Web服务 用于 POI/地理编码，Web端 用于地图 JSAPI */
const AMAP_KEY = "b776cd78eaf154a9334b726f21798a4b";            // Web服务
const AMAP_JS_KEY = "1fc2885826c49b3c1c86845a118f5ed8";          // Web端(JS API)
const AMAP_SECURITY = "a91da0350203a02657511acd68b549fc";        // 安全密钥

let jsonpSeq = 0;
function jsonp(url, cbParam){
  cbParam = cbParam || "callback";
  return new Promise((resolve, reject) => {
    const name = "__jp" + (++jsonpSeq) + "_" + Date.now();
    const s = document.createElement("script");
    let done = false;
    const cleanup = () => {
      try{ delete window[name]; }catch(e){ window[name] = undefined; }
      if(s.parentNode) s.parentNode.removeChild(s);
    };
    const timer = setTimeout(() => {
      if(done) return; done = true; cleanup(); reject(new Error("timeout"));
    }, 9000);
    window[name] = data => {
      if(done) return; done = true; clearTimeout(timer); cleanup(); resolve(data);
    };
    s.onerror = () => {
      if(done) return; done = true; clearTimeout(timer); cleanup(); reject(new Error("network"));
    };
    s.src = url + (url.indexOf("?") > -1 ? "&" : "?") + cbParam + "=" + name;
    document.head.appendChild(s);
  });
}

/* ----------------------------------------------------------
   地理编码：多源链式回退
   高德（配了 key 时最准）→ Photon → Nominatim
   挂掉两次的服务会被熔断，避免每次都白等超时
   ---------------------------------------------------------- */
const providerHealth = { amap: 0, photon: 0, nominatim: 0 };

async function geocodeAmap(q){
  const u = "https://restapi.amap.com/v3/place/text?keywords=" + encodeURIComponent(q) +
            "&offset=6&page=1&extensions=base&key=" + AMAP_KEY;
  const d = await jsonp(u, "callback");
  if(!d || d.status !== "1") throw new Error("amap");
  return (d.pois || []).map(p => {
    const parts = String(p.location || "").split(",");
    const g = gcj2wgs(Number(parts[0]), Number(parts[1]));   // 高德返回 GCJ02，统一转成 WGS84
    return {
      name: p.name,
      poiId: p.id ? String(p.id) : null,
      addr: (p.pname || "") + (p.cityname || "") + (p.adname || "") + (p.address || ""),
      lat: g[1], lng: g[0]
    };
  });
}

async function geocodePhoton(q){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 6000);
  try{
    const r = await fetch("https://photon.komoot.io/api/?limit=6&q=" + encodeURIComponent(q),
                          { signal: ctl.signal });
    if(!r.ok) throw new Error("photon-http");
    const d = await r.json();
    return (d.features || []).map(f => {
      const p = f.properties || {};
      const c = (f.geometry && f.geometry.coordinates) || [];
      const bits = [p.city, p.district, p.street, p.housenumber].filter(Boolean);
      return {
        name: p.name || q,
        addr: bits.join(" "),
        lat: Number(c[1]), lng: Number(c[0])
      };
    });
  } finally {
    clearTimeout(timer);
  }
}

async function geocodeNominatim(q){
  const u = "https://nominatim.openstreetmap.org/search?format=json&limit=6&accept-language=zh-CN&q=" +
            encodeURIComponent(q);
  const d = await jsonp(u, "json_callback");
  if(!Array.isArray(d)) throw new Error("nominatim");
  return d.map(x => ({
    name: String(x.display_name || "").split(",")[0].trim() || q,
    addr: String(x.display_name || "").split(",").slice(1, 4).join("").trim(),
    lat: Number(x.lat),
    lng: Number(x.lon)
  }));
}

/* 返回 [{ name, addr, lat, lng }]，无结果返回 []；全部服务不可用会抛错 */
async function geocode(query){
  const chain = [];
  if(AMAP_KEY) chain.push(["amap", geocodeAmap]);
  chain.push(["photon", geocodePhoton]);
  chain.push(["nominatim", geocodeNominatim]);

  let answered = false, errored = false;

  for(const pair of chain){
    const name = pair[0], fn = pair[1];
    if(providerHealth[name] >= 2) continue;      // 熔断
    try{
      const list = await fn(query);
      providerHealth[name] = 0;
      answered = true;
      if(list && list.length) return list;
    }catch(e){
      providerHealth[name] = (providerHealth[name] || 0) + 1;
      errored = true;
    }
  }

  if(answered) return [];                        // 有服务正常应答，就是真没结果
  if(errored) throw new Error("network");        // 全都挂了
  return [];
}

/* 从多个候选里挑一个：优先离某个已知城市最近的那个 */
function pickPlace(list){
  let best = list[0], bestCity = null, bestKm = Infinity;
  list.forEach(c => {
    CITIES.forEach(city => {
      const v = CITY_VIEW[city];
      const km = haversine(c.lat, c.lng, v.center[0], v.center[1]);
      if(km < bestKm){ bestKm = km; best = c; bestCity = city; }
    });
  });
  return { place: best, city: bestCity, km: bestKm };
}

/* 离得最近的已知城市（不足 80 公里才算） */
function nearestSupportedCity(lat, lng){
  let best = null, bestKm = Infinity;
  CITIES.forEach(city => {
    const v = CITY_VIEW[city];
    const km = haversine(lat, lng, v.center[0], v.center[1]);
    if(km < bestKm){ bestKm = km; best = city; }
  });
  return bestKm < 80 ? best : null;
}

async function searchDestination(query){
  query = (query || "").trim();
  if(!query) return;
  const input = $("#destQ");
  if(input) input.blur();

  try{
    let list = await geocode(query);
    if(!list.length) throw new Error("no-result");
    let picked = pickPlace(list);

    // 同名地点太多时会飘到别的省市，带上当前城市名再试一次
    if(picked.km > 80 && query.indexOf(state.city) === -1){
      try{
        const again = await geocode(query + " " + state.city);
        if(again.length){
          const p2 = pickPlace(again);
          if(p2.km < picked.km){ list = again; picked = p2; }
        }
      }catch(e){ /* 重试失败就沿用第一次的结果 */ }
    }

    // 还是离所有支持的城市很远，多半是搜错了，别把地图飞过去
    if(picked.km > 120){
      throw new Error("no-result");
    }

    // 目的地明显属于别的城市时，顺手把城市切过去
    if(picked.city && picked.km < 80 && picked.city !== state.city){
      state.city = picked.city;
      document.querySelectorAll("#cityChips .chip").forEach(b => {
        b.classList.toggle("on", b.dataset.city === picked.city);
      });
      $("#brandSeal").textContent = CITY_ABBR[picked.city] || picked.city.slice(0, 1);
      $("#brandTitle").textContent = picked.city + "美食地图";
      document.title = picked.city + "美食地图";
      state.cuisines.clear();
    }
    applyDestination(picked.place);
    toast("已定位到「" + picked.place.name + "」");
  }catch(err){
    if(err.message === "no-result"){
      toast("没找到「" + query + "」，试着加上城市名或更具体的地标");
    }else{
      toast("地点搜索失败，检查网络后重试");
    }
  }
}

/* =========================================================
   6b. 导航跳转
   站内数据统一存 WGS-84；高德要 GCJ-02，百度要 BD-09（在 GCJ 上再偏一次）
   ========================================================= */
function gcj2bd(lng, lat){
  const xPi = Math.PI * 3000 / 180;   // 百度公式的固定系数
  // 注意：直接对 GCJ 坐标算，最后才加偏移。先减后加会偏出近 1 公里
  const z = Math.sqrt(lng * lng + lat * lat) + 0.00002 * Math.sin(lat * xPi);
  const t = Math.atan2(lat, lng) + 0.000003 * Math.cos(lng * xPi);
  return [z * Math.cos(t) + 0.0065, z * Math.sin(t) + 0.006];
}

function navCoords(r){
  const g = wgs2gcj(r.lng, r.lat);          // 返回 [lng, lat]
  return { gcj: g, bd: gcj2bd(g[0], g[1]) };
}

function amapNavUrl(r){
  const g = navCoords(r).gcj;
  const to = g[0].toFixed(6) + "," + g[1].toFixed(6) + "," + encodeURIComponent(r.name || "目的地");
  // callnative=1：装了 App 直接唤起导航，没装自动落到网页版路线
  return "https://uri.amap.com/navigation?to=" + to +
         "&mode=car&coordinate=gaode&callnative=1&src=chishenme";
}

function baiduNavUrl(r){
  const b = navCoords(r).bd;
  const dest = "latlng:" + b[1].toFixed(6) + "," + b[0].toFixed(6) + "|" + encodeURIComponent(r.name || "目的地");
  return "http://api.map.baidu.com/direction?destination=" + dest +
         "&mode=driving&coord_type=bd09ll&output=html&src=chishenme";
}

let navTargetId = null;

function openNav(id){
  const r = findRest(id || state.selectedId);
  if(!r || r.lat == null) return;
  navTargetId = r.id;
  $("#navTitle").textContent = "去「" + r.name + "」";
  $("#navAddr").textContent = r.addr || "（地址待补充，将按坐标导航）";
  $("#navModal").classList.add("open");
}
function closeNav(){ $("#navModal").classList.remove("open"); }

function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  }
  return fallbackCopy(text);
}
function fallbackCopy(text){
  return new Promise(resolve => {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;top:-1000px;left:0;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
    resolve();
  });
}

function availableCuisines(){
  const set = new Set();
  scopeRest().forEach(r => set.add(r.cuisine));
  return CUISINES.filter(c => set.has(c));
}

function renderCuisineFilters(){
  const list = availableCuisines();

  // 这座城市一条数据都没有时，菜系筛选和图例都没有意义，直接收起来
  const row = $("#cuisineRow");
  if(row) row.style.display = list.length ? "" : "none";

  $("#cuisineChips").innerHTML =
    '<button class="chip' + (state.cuisines.size ? "" : " on") + '" data-cu="__all">全部</button>' +
    list.map(c =>
      '<button class="chip' + (state.cuisines.has(c) ? " on" : "") + '" data-cu="' + c +
      '"><i class="dot" style="background:' + cuColor(c) + '"></i>' + c + "</button>"
    ).join("");

  const legend = $("#legend");
  if(legend){
    legend.style.display = list.length ? "" : "none";
    legend.innerHTML =
      list.map(c => '<i><span class="dot" style="background:' + cuColor(c) + '"></span>' + c + "</i>").join("") +
      '<i style="color:#a89f8f;margin-left:2px">点越大 · 评价越多</i>';
  }
}

  $("#cityChips").addEventListener("click", e => {

    setPicked(null);

    sugSeq++;                                    // 让在途请求的结果失效

      btn.disabled = true;
      try{

          id: "u" + Date.now() + Math.random().toString(36).slice(2, 6),

        });

        drawMarkers(); renderList();
        toast("评价已保存");
      }catch(err){
        btn.disabled = false;
        toast("保存失败：" + err.message);
      }
    }
  });

  // 底图切换
  $("#bmAmap").addEventListener("click", () => setBasemap("amap"));
  $("#bmOsm").addEventListener("click", () => setBasemap("osm"));

  // 添加餐厅
  $("#fCuisine").innerHTML = CUISINES.map(c => '<option>' + c + '</option>').join("");

  $("#btnCancel").addEventListener("click", closeModal);
  $("#btnPick").addEventListener("click", startPick);
  $("#btnSave").addEventListener("click", saveRestaurant);

  // 导出 / 重置
  $("#btnExport").addEventListener("click", e => {
    e.preventDefault();
    const data = { restaurants: customRest, reviews: userRevs, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "chishenme-data.json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast("已导出 JSON");
  });

  $("#btnReset").addEventListener("click", async e => {
    e.preventDefault();
    if(store.remote){
      toast("数据存在云端，本机清空不会影响别人");
      return;
    }
    if(!confirm("确定清空本机添加的餐厅和评价？此操作不可撤销。")) return;
    await store.reset();
    state.selectedId = null;
    closeDetail(); refresh(); toast("本机数据已清空");
  });

  // 移动端抽屉
  $("#grab").addEventListener("click", () => {
    $("#panel").classList.toggle("collapsed");
  });
  $("#mpill").addEventListener("click", () => {
    $("#panel").classList.toggle("collapsed");
  });
  if(window.matchMedia("(max-width: 900px)").matches){
    $("#panel").classList.add("collapsed");
  }

  // Esc
  document.addEventListener("keydown", e => {
    if(e.key === "Escape"){
      if(state.pickMode){ endPick(); $("#modal").classList.add("open"); }
      else if($("#navModal").classList.contains("open")) closeNav();
      else if($("#modal").classList.contains("open")) closeModal();
      else closeDetail();
    }
  });

  window.addEventListener("resize", () => { if(map) map.resize(); });
}

function openDetailStatsOnly(r){
  const s = statsFor(r);
  const big = $("#dheadInner .big");
  if(big){
    if(s.rating){ big.textContent = s.rating.toFixed(1); big.classList.remove("none"); }
    else { big.textContent = "暂无"; big.classList.add("none"); }
  }
  const cells = $("#dheadInner .dstats").children;
  if(cells[3]) cells[3].querySelector(".val").textContent = s.count || 0;
  const h4 = $("#dbody h4 em");
  if(h4) h4.textContent = reviewsFor(r.id).length;
}

function closeDetail(){
  state.selectedId = null;
  $("#detail").classList.remove("open");
  try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
  drawMarkers(); renderList();
}

function switchCity(city){
  if(!CITY_DATA[city]) return;
  state.city = city;
  state.selectedId = null;
  state.cuisines.clear();
  // 切城市就退出目的地视图，两种范围不要混在一起
  if(state.dest){ state.dest = null; drawDestCircle(); renderDestBar(); }

  document.querySelectorAll("#cityChips .chip").forEach(b => {
    b.classList.toggle("on", b.dataset.city === city);
  });
  renderCuisineFilters();

  $("#brandSeal").textContent = CITY_ABBR[city] || city.slice(0, 1);
  $("#brandTitle").textContent = city + "美食地图";
  document.title = city + "美食地图";

  $("#detail").classList.remove("open");
  try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}

  const v = CITY_VIEW[city];
  if(map && v) map.setZoomAndCenter(v.zoom, amapPos(v.center[0], v.center[1]), false);

  renderList();
  drawMarkers();
}

function openModal(){
  state.newLat = null; state.newLng = null; state.newPoiId = null;
  $("#fName").value = ""; $("#fAddr").value = "";
  $("#fPrice").value = ""; $("#fRate").value = "";
  $("#fCity").value = state.city;
  $("#fCoord").textContent = "未选择";
  $("#fSug").classList.remove("on");
  $("#fSug").innerHTML = "";
  setPicked(null);
  if(pickMarker && map){ map.remove(pickMarker); pickMarker = null; }
  $("#modal").classList.add("open");
  setTimeout(() => $("#fName").focus(), 80);
}

function setPicked(place){
  const el = $("#fPicked");
  if(!el) return;
  if(!place){
    el.classList.remove("on");
    el.classList.remove("warn");
    el.textContent = "";
    return;
  }
  el.classList.add("on");
  if(place.ok){
    el.classList.remove("warn");
    el.textContent = "✓ 已定位" + (place.addr ? "：" + place.addr : "");
    $("#fCoord").textContent = place.lat.toFixed(5) + ", " + place.lng.toFixed(5);
  }else{
    el.classList.add("warn");
    el.textContent = place.msg || "";
  }
}

/* 选中一条候选：填名称、地址、坐标，并把地图挪过去 */
function applySuggestion(item){
  $("#fName").value = item.name;
  if(item.addr) $("#fAddr").value = item.addr;
  state.newLat = item.lat;
  state.newLng = item.lng;
  state.newPoiId = item.poiId || null;

  const city = nearestSupportedCity(item.lat, item.lng);
  if(city) $("#fCity").value = city;

  setPicked({ ok: true, addr: item.addr, lat: item.lat, lng: item.lng });
  $("#fSug").classList.remove("on");
  $("#fSug").innerHTML = "";

  if(map){
    if(pickMarker){ map.remove(pickMarker); pickMarker = null; }
    const pos = amapPos(item.lat, item.lng);
    pickMarker = new AMap.CircleMarker({
      center: pos, radius: 8, strokeColor: "#c8452a", strokeWeight: 3,
      fillColor: "#c8452a", fillOpacity: .45, zIndex: 200
    });
    map.add(pickMarker);
    map.setZoomAndCenter(16, pos, true);
  }
}

let sugTimer = null, sugSeq = 0;

function renderSuggestions(list, query){
  const box = $("#fSug");
  if(!list.length){
    box.innerHTML = '<div class="hint">没搜到「' + esc(query) + '」，试试加上区域名</div>';
    box.classList.add("on");
    return;
  }
  box.innerHTML = list.slice(0, 6).map((it, i) =>
    '<div class="item" data-i="' + i + '">' +
      '<div class="nm">' + esc(it.name) + '</div>' +
      '<div class="ad">' + esc(it.addr || "（无地址信息）") + '</div>' +
    '</div>'
  ).join("");
  box.classList.add("on");
  box._list = list;
  box.onmousedown = e => {
    const el = e.target.closest(".item");
    if(!el) return;
    e.preventDefault();
    const item = list[Number(el.dataset.i)];
    if(item) applySuggestion(item);
  };
}

async function searchSuggestions(query){
  const seq = ++sugSeq;
  const box = $("#fSug");
  box.innerHTML = '<div class="hint">搜索中…</div>';
  box.classList.add("on");
  try{
    const list = await geocode(query);
    if(seq !== sugSeq) return;                 // 有更新的输入，丢弃旧结果
    renderSuggestions(list, query);
  }catch(e){
    if(seq !== sugSeq) return;
    box.innerHTML = '<div class="hint">搜索服务暂时不可用，可点「在地图上调整」手动定位</div>';
    box.classList.add("on");
  }
}
function closeModal(){
  $("#modal").classList.remove("open");
  $("#modal").classList.remove("hiding");
  $("#fSug").classList.remove("on");

  state.pickMode = true;
  $("#modal").classList.add("hiding");
  $("#pickbar").classList.add("on");

}
function endPick(){
  state.pickMode = false;
  $("#pickbar").classList.remove("on");

async function saveRestaurant(){
  const name = $("#fName").value.trim();
  const price = Number($("#fPrice").value);
  const cuisine = $("#fCuisine").value;
  const city = $("#fCity").value;

  if(!name){ $("#fName").style.borderColor = "#c8452a"; $("#fName").focus(); return; }
  if(!(price >= 0) || $("#fPrice").value === ""){ $("#fPrice").style.borderColor = "#c8452a"; $("#fPrice").focus(); return; }

  const rate = Math.max(0, Math.min(5, Number($("#fRate").value) || 0));
  let lat = state.newLat, lng = state.newLng;
  let addr = $("#fAddr").value.trim();

  // 没点过候选，就再按店名自动定位一次
  if(lat == null && name){
    const btn = $("#btnSave");
    btn.disabled = true;
    setPicked({ ok: false, msg: "正在按店名定位…" });
    try{
      const list = await geocode(name);
      if(list.length){
        lat = list[0].lat; lng = list[0].lng;
        state.newPoiId = list[0].poiId || null;
        if(!addr) addr = list[0].addr || "";
        if(!$("#fAddr").value.trim()) $("#fAddr").value = addr;
        const nc = nearestSupportedCity(lat, lng);
        if(nc) $("#fCity").value = nc;
      }
    }catch(e){ /* 网络问题，下面统一提示 */ }
    btn.disabled = false;
  }

  if(lat == null){
    setPicked({ ok: false, msg: "没找到这家店的位置，点「在地图上调整」手动选一下" });
    return;
  }
  setPicked({ ok: true, addr: addr, lat: lat, lng: lng });

  const r = {
    id: "c" + Date.now(),
    name: name.slice(0, 30),
    city: city,
    cuisine: cuisine,
    price: Math.round(price),
    rating: rate,
    count: rate > 0 ? 1 : 0,
    addr: addr.slice(0, 60),
    lat: lat, lng: lng,
    tags: ["我添加的"],
    reviews: [],
    poi_id: state.newPoiId || null,
    custom: true
  };

  const btn = $("#btnSave");
  btn.disabled = true;
  let saved;
  try{
    saved = await store.addRestaurant(r);
  }catch(err){
    btn.disabled = false;
    setPicked({ ok: false, msg: "保存失败：" + err.message + "（检查网络后重试）" });
    return;
  }
  btn.disabled = false;

  closeModal();
  // 加了新店就退出目的地视图，否则新店可能落在圈外看不见
  if(state.dest){ state.dest = null; drawDestCircle(); renderDestBar(); }
  if(saved.duplicate){
    state.cuisines.clear();
    switchCity(saved.item.city);
    refresh();
    openDetail(saved.item.id);
    toast("这家店已经有人加过了，帮你打开它");
    return;
  }
  if(city !== state.city) switchCity(city);
  refresh();
  openDetail(saved.item.id);
  toast("已添加「" + saved.item.name + "」");
}

/* =========================================================
   9. 轻提示
   ========================================================= */
let toastTimer = null;
function toast(msg){
  let el = $("#toast");
  if(!el){
    el = document.createElement("div");
    el.id = "toast";
    el.style.cssText = "position:fixed;left:50%;bottom:88px;transform:translate(-50%,10px);" +
      "background:#1d1c1a;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;" +
      "z-index:1200;opacity:0;transition:.22s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:80vw;text-align:center";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  requestAnimationFrame(() => { el.style.opacity = "1"; el.style.transform = "translate(-50%,0)"; });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.style.opacity = "0";
    el.style.transform = "translate(-50%,10px)";
  }, 1900);
}

/* =========================================================
   10. 启动
   ========================================================= */
function refresh(){
  renderCuisineFilters();
  renderList();
  drawMarkers();
  renderDestBar();
}

async function boot(){
  bindUI();
  initMap();

  // 先用本机缓存把界面画出来，别让用户对着空白等网络
  if(!store.remote){
    customRest = loadJSON(LS_REST, []);
    userRevs = loadJSON(LS_REV, {});
  }
  refresh();

  // 再把云端数据补上；失败就保持本机数据不动
  if(store.remote){
    try{
      await store.load();
      window.__storeMode = "remote";
      refresh();
    }catch(e){
      console.warn("云端加载失败", e);
      window.__storeMode = "cache";
      toast("云端数据加载失败，先用本机缓存");
    }
  }else{
    window.__storeMode = "local";
  }

  // 支持 #id=d15 这种直达链接（跨城市也能打开）
  const m = /^#id=([\w-]+)$/.exec(location.hash || "");
  if(m){
    const r = findRest(m[1]);
    if(r){
      if(r.city !== state.city) switchCity(r.city);
      setTimeout(() => openDetail(r.id), 120);
    }
  }
}

  s.src = "https://webapi.amap.com/maps?v=2.0&key=" + AMAP_JS_KEY;
  s.onload = function(){ boot(); };
  s.onerror = function(){
    // 加载失败：降级成纯列表模式，筛选和评价仍可用
    bindUI();
    refresh();
    const el = document.createElement("div");
    el.style.cssText = "position:absolute;inset:0;display:grid;place-items:center;padding:40px;text-align:center;" +
      "color:#938d82;font-size:14px;line-height:1.9;background:#f2ece1;z-index:2";
    el.innerHTML = "地图加载失败（网络问题）<br>左侧筛选和列表、评价功能仍然可用。<br><br>" +
      '<span style="font-size:12px;opacity:.7">请检查网络后刷新</span>';
    document.getElementById("mapwrap").appendChild(el);
  };
  document.head.appendChild(s);
})();
</script>
